name: ci

# Gate 0 of the Go/No-Go checklist, automated.
#
# This runs the ONE check no authoring or cloud environment could: the real
# `npm install` + `npm run build` against the published @modelcontextprotocol/sdk.
# It is what surfaced the ToolResult type defect — had this existed, that
# regression could never have merged silently. Fully headless (no Godot GUI),
# so it runs on stock runners.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  contract-check:
    name: contract check (host↔addon↔catalog parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Static parity check (no Godot / no registry needed)
        run: python3 scripts/contract_check.py

  build:
    name: real SDK build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install against the real registry (reproducible)
        run: npm ci
      - name: Build — tsc against the real SDK types, 0 errors required
        run: npm run build
      - name: Assert dist/index.js was emitted
        run: test -f dist/index.js
      # 🔴 THE PATH COHORT, FLOORED — 172 §10.2. This enumerator succeeded
      # `_to_delete/enum163.mjs`, whose number (78) was quoted in three handoffs and two
      # shipped changelogs and was wrong by 180 rows. Its replacement shipped with
      # nothing comparing ITS number to anything either: five counts printed, exit 0,
      # whatever they said. 168's rule is that a measurement which gets SMALLER is not a
      # measurement that got better, and a blinded walk prints `total=0` and looks fine.
      # It also runs the ledger comparison, which until 173 needed the editor GUI under
      # Xvfb — it needs neither: a tool list over stdio and a file. ~2s on the dist/ the
      # step above just built. A step, not a 27th job.
      - name: The path cohort is at its floors and agrees with the ledger
        run: node scripts/path-cohort.mjs --summary
      - name: Onboarding CLI smoke — doctor runs headless (host-only, no Godot)
        # The bin dispatches `doctor` without touching the stdio server path.
        # /bin/echo stands in for the Godot binary (prints a version, exits 0);
        # no project.godot in host/ so the addon checks skip, and the four bridge
        # probes fail fast (nothing listening) as informational — so the report is
        # ok and exit code 0. Proves the built dist actually routes the subcommand.
        run: |
          GODOT_BIN=/bin/echo node dist/index.js doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('/tmp/doctor.json','utf8')); const g=r.checks.find(c=>c.name==='godot-binary'); if(!g||g.status!=='ok'){console.error('::error::doctor: godot-binary check not ok');process.exit(1);} if(!r.checks.some(c=>c.name==='editor-bridge')){console.error('::error::doctor: missing bridge checks');process.exit(1);} console.log('ONBOARD_DOCTOR_OK');"
      - name: Onboarding CLI smoke — init installs + enables the addon (host-only)
        # Resolves the addon from the repo-root addons/ in a fresh checkout, copies
        # it into a throwaway project, and enables it in project.godot.
        run: |
          tmp="$(mktemp -d)"
          printf 'config_version=5\n\n[application]\n\nconfig/name="smoke"\n' > "$tmp/project.godot"
          node dist/index.js init --project "$tmp" --client none
          test -f "$tmp/addons/breakpoint_mcp/plugin.cfg" || { echo "::error::init: addon not copied"; exit 1; }
          grep -q 'res://addons/breakpoint_mcp/plugin.cfg' "$tmp/project.godot" || { echo "::error::init: plugin not enabled"; exit 1; }
          echo "ONBOARD_INIT_OK"
      - name: Onboarding packaging — the addon is included in the npm tarball
        # stage-addon copies the canonical addon into host/addon/ (files: addon/**),
        # so the published tarball carries the addon that init installs.
        run: |
          npm run stage-addon
          npm pack --dry-run 2>&1 | grep -q 'addon/breakpoint_mcp/plugin.cfg' || { echo "::error::pack: addon missing from tarball"; exit 1; }
          echo "ONBOARD_PACK_OK"
      - name: Assert the resolved SDK is still 1.x
        # A v2 major changes the registerTool / import surface and needs the
        # migration in README before the package.json range is bumped.
        # Read the installed package.json off disk: the SDK's "exports" map does
        # not expose "./package.json", so require('@…/sdk/package.json').version
        # resolves to undefined on current Node and this check throws spuriously.
        run: |
          node -e "const v=JSON.parse(require('node:fs').readFileSync('node_modules/@modelcontextprotocol/sdk/package.json','utf8')).version; console.log('resolved @modelcontextprotocol/sdk', v); if(!v || !v.startsWith('1.')){console.error('::error::@modelcontextprotocol/sdk resolved to '+v+' (not 1.x). Apply the SDK v2 migration in README before bumping the range.'); process.exit(1);}"

  test:
    name: host tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Unit + loopback-socket integration tests (node:test, zero extra deps).
    # Fully headless — no Godot editor/LSP/DAP; the socket protocols are
    # exercised against in-process mock servers on 127.0.0.1.
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install against the real registry (reproducible)
        run: npm ci
      - name: Compile the suite and run it (node:test)
        run: npm test
      # 🔴 THE GATE ON THE GATE. `_population.mjs` is the only thing standing between
      # fourteen live probes and 169 §4's "…_ALL ok every claim held" — a sentence that
      # is true of the empty set. If the instrument silently stopped counting, all
      # fourteen would go back to reporting coverage they no longer have, in green.
      # No Godot, no ports, no deps: it runs here rather than earning a 27th job.
      - name: The population instrument, self-checked
        run: node test-integration/_population.selftest.mjs
      # 🔴 AND THE LEDGER COMPARISON, WHICH UNTIL 173 HAD NO GATE ANYWHERE. The four
      # claims deciding whether the live path cohort and path-cohort-ledger.tsv agree
      # lived inline in `authoring-plane`, a probe that boots the editor GUI under Xvfb,
      # so no case with a known answer had ever been put through them. A blinding
      # harness says nothing about an instrument with no gate — and says it in green.
      # It needs a tool list and a file: no Godot, no ports, no deps.
      - name: The path-cohort ledger comparison, self-checked
        run: node test-integration/_path_ledger.selftest.mjs
      # 🔴 AND THE CLEANUP THAT PROVES ITSELF, WHICH HAD THE SAME GAP ONE FILE OVER.
      # `_workspace.mjs` decides what AUTH_CLEAN's "byte-identical" means, and 174
      # measured it at SIX OF SIX STILL GREEN — every headless gate in the tree passed
      # with the module fully blinded, because it too was imported only by the Xvfb
      # probe. The seam is sharper than the absence: restoreDir decides what to REMOVE
      # from walk(), diffDir decides what APPEARED from walk(), so a blind enumerator
      # means the restore removes nothing AND the check that proves the restore worked
      # reports clean. Real temp dirs, node builtins only: no Godot, no ports, no deps.
      - name: The workspace snapshot/restore/diff, self-checked
        run: node test-integration/_workspace.selftest.mjs
      # 🔴 THE SAME GATE, FOR THE UNIT SUITE. 170 §10.2 asked whether taut169.mjs
      # reporting ZERO tautology candidates against these 47 files was good news or a
      # classifier that does not understand node:test. It was the classifier: its claim
      # finder only recognised bare-identifier callees, so it found zero CLAIM SITES —
      # and its own aggregated SCOPE line hid that collapse behind the probe suite's
      # healthy number. 2602 assertions across 676 blocks had never been swept.
      # No Godot, no ports, no deps: a step here rather than a 27th job.
      - name: The tautology instrument, self-checked
        run: node scripts/tautology_gate.selftest.mjs
      - name: No test block asserts only shape (tautology gate)
        run: node scripts/tautology_gate.mjs
      # 🔴 175. THE PNG READER DECIDES WHAT A RENDERED FRAME IS, AND NOTHING HEADLESS HAD
      # EVER RUN IT. Measured before this step existed: `BLIND175 _png.mjs 2 of 2 STILL
      # GREEN` — both exports replaced with constants and every gate above still passed,
      # because its only two importers are an Xvfb editor probe and a real-GPU script.
      # `sampleDistinctColours` returning >1 IS AUTH_SHOT_NOT_UNIFORM, the check that
      # separates a rasterizer that drew something from one that drew nothing (#143).
      - name: The PNG reader, self-checked
        run: node test-integration/_png.selftest.mjs
      # 🔴 AND THE GATE FOR THE ABSENCE OF A CHECK. 174 §11.3 asked which directories the
      # tautology sweep does not enter; the host root was one, and the classifier read it
      # as SILENT. 171 §2: a silent file either asserts nothing or asserts in an idiom the
      # finder cannot read. Here it was the first — three live drivers fetched a verdict
      # from a `runtime_assert_*` tool, wrote it to a transcript and exited 0 regardless,
      # and one of them printed "buggy FAILS both · fixed PASSES both — automation proves
      # the fix" as a STRING LITERAL with both measurements in hand. The tautology gate
      # cannot pin that: it grades CONDITIONS, and there was no condition to grade
      # (174 §3's division of labour). Steps, not a 27th job — TWELFTH session running.
      - name: The verdict instrument, self-checked
        run: node scripts/verdict_gate.selftest.mjs
      - name: Every recorded verdict is read (verdict gate)
        run: node scripts/verdict_gate.mjs
      # 🔴 AND THE SAME GATE FOR contract_check.py's OWN ENUMERATORS. 171 §10.21 asked
      # what each of them would print if its finder matched nothing. Measured in 172:
      # 25 blindable, 14 could match NOTHING and the run still said ALL HARD CHECKS
      # PASSED — including check 16, which exists BECAUSE checks 6/7 can be driven to
      # zero comparisons, and which floored its universe against the same finder it was
      # protecting. This step blinds each enumerator in turn and asserts the run goes
      # red. A floor never tested against the collapse it names is a claim that cannot
      # fail. ~18s, no Godot, no ports: a step here rather than a 27th job (NINTH
      # session running).
      # 🔴 AND THE TAUTOLOGY THAT LIVES ON THE OTHER SIDE OF THE BRIDGE — 177 §4.
      # `_filesystem_scan` returns `_ok({"scanning": true})` unconditionally and the
      # authoring probe asserted `.scanning === true`. Neither half is wrong alone and
      # `tautology_gate.mjs` cannot see it: it grades a claim's LEAVES, and `.scanning`
      # is a property of a value fetched at runtime — the textbook shape of the VALUE
      # claim it is built to pass. The constant is real but it is in GDScript, in another
      # file, on the far side of a JSON hop, and `call()` throws on `isError` so every
      # other return path escapes before the comparison is reached. Four live claims had
      # two outcomes: "true", and "never reached". A step, not a 27th job (FOURTEENTH
      # session running).
      - name: The boundary instrument, self-checked
        run: node scripts/boundary_gate.selftest.mjs
      - name: No claim is compared against a value the addon hard-wires (boundary gate)
        run: node scripts/boundary_gate.mjs
      # 🔴 AND THE DEFECT `_population.mjs`'s OWN SIX GATES STRUCTURALLY CANNOT SEE — 184
      # §5. `seal()` attributes every claim made since the PREVIOUS seal, so a marker
      # written above its own assertions owns the section before it and hands its own to
      # the next one. NOTHING goes unattributed when that happens, so gate 6 — the
      # unsealed count 184 added — is blind to it by construction; what breaks is the
      # report's AIM, one section off. 184 found four instances with a 40-line regex scan
      # that called itself heuristic in its own docstring, fixed them, and left the class.
      # 🔴 AND NO RUNTIME GATE CAN COVER IT EITHER, which is why this is a source scan: a
      # seal drains what has ALREADY happened, so every claim it takes preceded it in
      # time. 185 measured the call-site reading anyway before rejecting it — thirteen
      # assert-making helpers are defined below the first seal of their own file, and a
      # rule reading innermost stack frames would have called every claim they make a
      # violation. Static, ~1s, no Godot and no ports: a step here rather than a 27th job
      # (TWENTY-THIRD session running).
      - name: The seal-order instrument, self-checked
        run: node scripts/seal_order_gate.selftest.mjs
      - name: No marker is written above the claims it describes (seal order gate)
        run: node scripts/seal_order_gate.mjs
      - name: Every derived population collapses loudly (scope gate)
        run: python3 ../scripts/scope_gate.py
      # 🔴 AND THE SAME TECHNIQUE POINTED AT THE JS INSTRUMENTS — 172 §10.2, which named
      # `_population.mjs` and the path cohort as the two it had not reached. Measured in
      # 173: `reportOrDie()` could return 0 without reporting or exiting and the
      # population self-test stayed entirely GREEN — and ELEVEN of the fourteen live
      # probes call ONLY that member, so every gate above it was decorative in exactly
      # the probes with no other backstop. ~3s, and it needs dist-test/, which the
      # `npm test` step above has already emitted. A step, not a 27th job (TENTH session).
      # 🔴 182: THE LATE AXIS NEEDS `dist/`, AND `npm test` ONLY EMITS `dist-test/`.
      # The gate's live half runs `scripts/path-cohort.mjs`, which imports `dist/` and
      # spawns the server over stdio — headless, no editor. Without this step the gate
      # REFUSES rather than skipping, which is the whole point: a skipped axis reported
      # in green is the failure it exists to catch, and CI said so on the first run.
      - name: Build dist/ for the instrument gate's live axis
        run: npm run build
      - name: Every JS instrument collapses loudly (instrument gate)
        run: python3 ../scripts/instrument_gate.py
      # 🔴 AND THE THIRD TECHNIQUE, POINTED AT THE FLOORS THE OTHER TWO REST ON — 180
      # §11.3. 180 §7.3 set `SELFTEST_CLAIM_FLOOR = 0` in one self-test and the file
      # stayed green; the sweep behind this step asked every floor in the tree the same
      # question and SIX of twenty-five answered the same way, four of them the tautology
      # gate's own directory floors, whose roster was pinned by KEY and never by value.
      # A floor cannot be covered by the live reverse sweep for 180 §8's reason — it is
      # reachable only from below and the tree is above it by construction — so this is
      # the only place the coverage can live. ~40s. A step, not a 27th job (EIGHTEENTH
      # session running).
      - name: Every floor's own value is pinned (floor pin gate)
        run: python3 ../scripts/floor_pin_gate.py
