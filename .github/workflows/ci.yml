name: ci

# Gate 0 of the Go/No-Go checklist, automated.
#
# This runs the ONE check no authoring or cloud environment could: the real
# `npm install` + `npm run build` against the published @modelcontextprotocol/sdk.
# It is what surfaced the ToolResult type defect — had this existed, that
# regression could never have merged silently. Fully headless (no Godot GUI),
# so it runs on stock runners.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  contract-check:
    name: contract check (host↔addon↔catalog parity)
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 — check 4 (`release_names.py --assert-addon`, below) walks
      # git history to ask whether the addon has moved since its own version was
      # stamped. The default shallow clone has no history to walk, which is why the
      # promotion 220 §8.10 called a one-line change was two.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Static parity check (no Godot / no registry needed)
        run: python3 scripts/contract_check.py
      # 🔴 THE CEILING'S REFUSAL, PROVED WITHOUT THE REGISTRY — 206 §3.
      # `scripts/registry_lag.py` is the reader 205 §8.3 asked for: it prints the
      # registry-vs-tags distance at a release cut and refuses above LAG_CEILING. The
      # LIVE half needs network and is only actionable at a cut, so it is NOT run here.
      # This is the other half, and it is the half 204 §8.27 is about — *a check that
      # has never refused has not been audited*. The selftest drives the pure reader over
      # eight rows, FOUR of which must refuse, including the real 205 incident at lag 43.
      # Without this step LAG_CEILING is a literal nobody re-derives, which is the class
      # of artefact the file was written to replace. Pure stdlib, ~0.1s: a step here
      # rather than a 27th job (FORTY-FOURTH session running).
      - name: The registry-lag ceiling can still refuse (registry lag selftest)
        run: python3 scripts/registry_lag.py --selftest
      # 🆕 213 §2 — `scripts/registry_bytes.py` is the reader 212 §6.3 asked for: the
      # one that OPENS the published tarball rather than reading a version string
      # about it. Its LIVE half needs the registry AND a version that matches this
      # tree, so it is a release-time reader exactly like registry_lag's. `--selftest`
      # is pure — no network, no npm — and drives the comparator over ten rows plus
      # the extraction trap that says why it compares TREES and not `.tgz` bytes.
      # 🆕 227 — AND THE PUBLISH PRECONDITION'S TABLES. `--assert-auth` asks whether this
      # machine can publish at all (226 §5's dead token, which stopped a cut mid-ritual
      # and was the SECOND time credentials did); its live half needs credentials CI
      # does not have and must not, so only its pure halves run here — the four auth
      # states, and the npm-output parse the live tree corrected within the hour.
      # ~1s. A step, not a 27th job (FIFTY-FIRST session running).
      - name: The registry-bytes comparator can still refuse (registry bytes selftest)
        run: python3 scripts/registry_bytes.py --selftest
      # 🆕 216 §1 — `scripts/release_names.py` is CHECK 1, out of the gitignored ritual.
      # 215 §3 found TWO real defects in it (a population floor that read only the
      # SCREAMING case, and a lower_snake regex that could not see `body_brace()`) and
      # fixed BOTH in `host/_to_delete/release215.py` — scratch, copied forward by hand,
      # which is the file 211 §4's pre-written tautology also died in. 215 §6.3 priced
      # that: *a real defect was found and fixed in a file that is not in the repository*.
      # 🔴 AND PROMOTING IT FOUND A THIRD, IN THE ARM 215 DID NOT TOUCH: the ritual runs
      # one arm per cut, so the two arms had never been driven over the same block, and
      # they CONTRADICT each other about what a lower_snake name reaching shipped source
      # means. The old MINOR arm PASSED on 1.73.2 — the release three handoffs wrongly
      # called a MINOR. It now reads the DIFF WINDOW instead, and refuses.
      # `--selftest` is pure — no npm, no network — and drives every refusal this file
      # can make, plus three counterfactuals: NAME_FLOOR against the real 1.73.2 block,
      # the tag round trip, and 🆕 227's CROSS-LANGUAGE round trip between the line
      # `host/scripts/wire_diff.mjs` prints and the pattern check 8 reads.
      # 🆕 227 — AND CHECK 8 AND CHECK 1's MAJOR ARM ARE IN IT NOW. The wire classifier's
      # LIVE half needs a baseline build and a compiled server, so it stays release-time
      # like registry_lag's; its PURE half — does this bump cover what the wire did —
      # runs on every push exactly like the rest.
      # ~0.1s. A step, not a 27th job (FIFTY-FIFTH session running).
      - name: Check 1's refusals still fire (release names selftest)
        run: python3 scripts/release_names.py --selftest
      # 🔴 CHECK 4, PROMOTED — 220 §8.10, CARRIED FOR FIVE SESSIONS AS "the cheapest
      # item on this list". It asks whether the addon has MOVED since its own version
      # was stamped, which is the question that matters most at an Asset Library
      # submission — and a submission is not a cut, so the release ritual that also
      # runs this reader never fires there. Reads git, no network. Its siblings
      # `--selftest` (above) and `--assert-map` (build job) were promoted long ago;
      # this one was written runnable-on-its-own in 219 and then wired to nothing.
      - name: Check 4 — the addon version still names the addon's tree (release names)
        run: python3 scripts/release_names.py --assert-addon
      # 🆕 244 §1 — THE SAME SELF-TEST THE `test` JOB RUNS, ON THE OTHER KIND OF MACHINE,
      # AND THAT IS THE ENTIRE POINT OF THE STEP. `handoff_gate.py --selftest` proves its
      # interval readers against `BLOCK_POPULATION`'s real commits, and the `test` job's
      # checkout is the default `--depth 1` — so over there NONE of those endpoints exist
      # and every population claim takes its refusal path. That is correct behaviour on a
      # shallow tree, and it is also nine sessions of two claims passing over the empty
      # set, which is what 243's two NEW controls made visible by reddening instead.
      # This job already fetches the whole history for check 4 above, so it is the one
      # place in CI where the DEEP half runs: the negative control that rewrites a real
      # `MOVED +n` into a false `UNMOVED`, and the positive one that must still accept a
      # true one. Both halves now run on every push, each on a machine it can be read on.
      # Pure stdlib, ~0.3s. A step, not a 27th job.
      - name: The interval controls run where the history is (handoff gate selftest)
        run: python3 scripts/handoff_gate.py --selftest
      # 🆕 THE SPEC-CONFORMANCE LEDGER — 223 §6.2 (B2 / M0 / D11). 223 fixed eleven
      # shipped strings naming methods revision 2026-07-28 deletes, and a human found
      # them by reading a changelog. This reader finds them mechanically: it classifies
      # every method-shaped string in the shipped surface against what each published
      # revision actually defines, and refuses on one a client would read and believe.
      # OFFLINE by construction — the ledger is checked in, so CI never depends on
      # github.com being up; `--refresh` re-derives it from upstream and lives on the
      # sdk-drift schedule instead. Pure stdlib, ~0.3s. A step, not a 27th job.
      - name: The scanner's own refusals still fire (spec conformance selftest)
        run: python3 scripts/spec_conformance.py --selftest
      - name: No shipped string names a method the spec removed (spec conformance)
        run: python3 scripts/spec_conformance.py --check
      # 🆕 225 — RULE 1's VOCABULARY, ENFORCED WHERE 223's SWEEP DID NOT REACH. That
      # session rewrote nine documents and reported zero residual terms; the word was
      # still in five source files, two of which PRINTED it on a green run. Pure stdlib,
      # reads its term list out of the policy document rather than carrying a copy.
      - name: The terminology parser can still refuse (terminology selftest)
        run: python3 scripts/terminology_gate.py --selftest
      - name: No shipped file uses a retired term (terminology gate)
        run: python3 scripts/terminology_gate.py
      # 🆕 230 — 229 §5.2 / NEXT 3, THE ONLY ITEM ON THAT LIST WITH A MEASURED PRECEDENT.
      # `pyflakes` reported the duplicate `SIZE_LEDGER` key that opened session 229 for as
      # long as it has existed; 228 spent a session finding it by reading and 229 built a
      # bespoke reader for it. Eleven instruments in this tree and that defect was one
      # `pip install` away the whole time.
      # 🔴 IT IS A CLASS ROSTER AND NOT A TOTAL, AND THAT IS THE WHOLE DESIGN. Measured on
      # the live tree pyflakes reports SIX findings in TWO classes and every one is
      # cosmetic — the defect that motivated the item is already fixed. A ceiling on the
      # TOTAL would therefore be satisfied by a tree that deleted one f-string and grew a
      # duplicate key: six before, six after, green. That is 229 §2's collapsible
      # population in a third file, so each class carries its own ceiling and an
      # UNDECLARED class reddens on sight whatever the total does.
      # 🔴 AND A MISSING LINTER IS RED, NOT A SKIP — `registry_lag.py`'s reason, three
      # steps up: a reader that goes quiet when it cannot see is how a standing decision
      # gets written down in place of a command nobody re-ran. ~1s. A step, not a 27th job.
      # 🆕 242 — THE LINT ROSTER MOVED TO THE `test` JOB, AND THE MOVE IS THE ROW.
      # `lint-roster-py-only` (230) said the roster covered `scripts/*.py` and nothing
      # else while 64 tracked `.mjs` — every gate instrument, every probe, every demo
      # script — sat outside every `tsconfig` include and were read by no standard tool
      # at all. The gate now runs `tsc --allowJs --checkJs` over them as well, so it
      # needs BOTH off-the-shelf tools, and this job installs neither Node nor
      # `node_modules`. It runs where both already exist rather than growing a second
      # copy of the toolchain here. 🔴 The move is a step changing jobs and not a job
      # changing count: `ci_check_runs()` still derives twenty-six.
      # 🆕 240 — THE QUEUE, WHICH WAS THE ONE TABLE IN THIS TREE NOTHING READ.
      # `handoff_gate.py` binds every counter a status block prints to the instrument
      # that printed it and refuses over one disagreement. It parses the block, the
      # header and the replay. It has never parsed §6 — and §6 is the list of what this
      # project intends to do. Measured over 220–239 that list held 20–25 items and never
      # drained: every session closed the two items the session before it had created and
      # carried the rest, so the review charter's P0 sat open for thirty-four sessions
      # while four consecutive handoffs reported closing work.
      # 🔴 IT IS IN CI RATHER THAN IN THE AUTHORING RITUAL FOR THE REASON 238 §2 GAVE
      # ABOUT `BLOCK_POPULATION`: `.gitignore` carries `HANDOFF*.md`, so anything that
      # lives only in a handoff is unreadable on exactly the two machines nobody watches.
      # The queue is not a record of what one session measured — it is the state of the
      # project — so it belongs in the tree. ~0.1s, stdlib only. A step, not a job.
      - name: The queue parser can still refuse (queue gate selftest)
        run: python3 scripts/queue_gate.py --selftest
      - name: No item is past the ceiling undecided, no schedule has lapsed, and no
          session closed only what it invented (queue gate)
        run: python3 scripts/queue_gate.py
      # 🆕 243 — THE THIRD P0 REPORTER, AND IT IS HERE FOR ITS TWO SIBLINGS' REASON.
      # 242 put `p0_complexity.selftest.mjs` and `p0_testdup.selftest.mjs` in the `test`
      # job after both reporters shipped tracked in 241 importing a Node 22 export
      # against `engines.node ">=18"` — an ESM LINK error, so on the 18 and 20 legs the
      # modules never loaded and 26 jobs said nothing. `p0_comments.py` was the third
      # reporter of that same charter pass and got neither a self-test nor a roster, so
      # it stayed in exactly the state that cost 241 a session. It is Python and stdlib
      # only, so it runs here rather than in the job that has Node.
      # 🔴 AND THE FIRST THING THIS STEP BUYS IS THE LOAD, NOT THE CLAIMS: until 243
      # nothing in this tree executed that file at all.
      - name: The comment inventory still measures what it claims (p0 comments selftest)
        run: python3 scripts/p0_comments.py --selftest
      # 🔴 THE COMMENT THAT DESCRIBED A STEP THAT WAS NOT THERE — found in 224 and
      # fixed by deletion. Eight lines here described the token-cost selftest, quoting
      # pre-208 figures; the step itself has always lived in the `test` job, whose own
      # comment pointed back at "the selftest in the contract-check job". Nothing in
      # this tree reads a workflow file, so no gate caught either half of that.

  build:
    name: real SDK build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install against the real registry (reproducible)
        run: npm ci
      - name: Build — tsc against the real SDK types, 0 errors required
        run: npm run build
      - name: Assert dist/index.js was emitted
        run: test -f dist/index.js
      # 🔴 THE PATH COHORT, FLOORED — 172 §10.2. This enumerator succeeded
      # `_to_delete/enum163.mjs`, whose number (78) was quoted in three handoffs and two
      # shipped changelogs and was wrong by 180 rows. Its replacement shipped with
      # nothing comparing ITS number to anything either: five counts printed, exit 0,
      # whatever they said. 168's rule is that a measurement which gets SMALLER is not a
      # measurement that got better, and a blinded walk prints `total=0` and looks fine.
      # It also runs the ledger comparison, which until 173 needed the editor GUI under
      # Xvfb — it needs neither: a tool list over stdio and a file. ~2s on the dist/ the
      # step above just built. A step, not a 27th job.
      - name: The path cohort is at its floors and agrees with the ledger
        run: node scripts/path-cohort.mjs --summary
      - name: Onboarding CLI smoke — doctor runs headless (host-only, no Godot)
        # The bin dispatches `doctor` without touching the stdio server path.
        # /bin/echo stands in for the Godot binary (prints a version, exits 0);
        # no project.godot in host/ so the addon checks skip, and the four bridge
        # probes fail fast (nothing listening) as informational — so the report is
        # ok and exit code 0. Proves the built dist actually routes the subcommand.
        run: |
          GODOT_BIN=/bin/echo node dist/index.js doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json
          node -e "const r=JSON.parse(require('node:fs').readFileSync('/tmp/doctor.json','utf8')); const g=r.checks.find(c=>c.name==='godot-binary'); if(!g||g.status!=='ok'){console.error('::error::doctor: godot-binary check not ok');process.exit(1);} if(!r.checks.some(c=>c.name==='editor-bridge')){console.error('::error::doctor: missing bridge checks');process.exit(1);} console.log('ONBOARD_DOCTOR_OK');"
      - name: Onboarding CLI smoke — init installs + enables the addon (host-only)
        # Resolves the addon from the repo-root addons/ in a fresh checkout, copies
        # it into a throwaway project, and enables it in project.godot.
        run: |
          tmp="$(mktemp -d)"
          printf 'config_version=5\n\n[application]\n\nconfig/name="smoke"\n' > "$tmp/project.godot"
          node dist/index.js init --project "$tmp" --client none
          test -f "$tmp/addons/breakpoint_mcp/plugin.cfg" || { echo "::error::init: addon not copied"; exit 1; }
          grep -q 'res://addons/breakpoint_mcp/plugin.cfg' "$tmp/project.godot" || { echo "::error::init: plugin not enabled"; exit 1; }
          echo "ONBOARD_INIT_OK"
      - name: Onboarding packaging — the addon is included in the npm tarball
        # stage-addon copies the canonical addon into host/addon/ (files: addon/**),
        # so the published tarball carries the addon that init installs.
        run: |
          npm run stage-addon
          npm pack --dry-run 2>&1 | grep -q 'addon/breakpoint_mcp/plugin.cfg' || { echo "::error::pack: addon missing from tarball"; exit 1; }
          echo "ONBOARD_PACK_OK"
      # 🆕 217 §2 — CHECK 3's BOTH-WAYS ASSERTION, OUT OF THE GITIGNORED RITUAL.
      # 216 §6.4 named the gap and said it would be paid the same way 216 §6.3 was:
      # `SHIPPED_SOURCE` moved to `scripts/release_names.py` and the ritual imports it,
      # but the assertion OVER that map — every packed root maps to a declared source,
      # and every declared source is still shipped — stayed in `host/_to_delete/`, a
      # file that is not in this repository. It is `--assert-map` now.
      # 🔴 IT GOES HERE AND NOT IN `contract-check` FOR ONE REASON: it needs a real
      # `npm pack --dry-run`, and this job is the one that has already run
      # `npm run stage-addon`, so the `addon` root actually exists. Run it anywhere
      # else and it refuses with MAP_STALE for a reason that is about the runner and
      # not about the tree.
      # 🔴 AND IT NOW RUNS ON EVERY PUSH RATHER THAN ONCE A RELEASE. That is the whole
      # value of the promotion: the ritual asked this question ~23 times, at the one
      # moment when answering "no" is most expensive. ~1s, and a STEP — not a 27th job
      # (FIFTY-FIFTH session running).
      - name: Every shipped root maps to a declared source, both ways (release names)
        run: python3 ../scripts/release_names.py --assert-map
      - name: Assert the resolved SDK is still 1.x
        # A v2 major changes the registerTool / import surface and needs the
        # migration in README before the package.json range is bumped.
        # Read the installed package.json off disk: the SDK's "exports" map does
        # not expose "./package.json", so require('@…/sdk/package.json').version
        # resolves to undefined on current Node and this check throws spuriously.
        run: |
          node -e "const v=JSON.parse(require('node:fs').readFileSync('node_modules/@modelcontextprotocol/sdk/package.json','utf8')).version; console.log('resolved @modelcontextprotocol/sdk', v); if(!v || !v.startsWith('1.')){console.error('::error::@modelcontextprotocol/sdk resolved to '+v+' (not 1.x). Apply the SDK v2 migration in README before bumping the range.'); process.exit(1);}"

  test:
    name: host tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Unit + loopback-socket integration tests (node:test, zero extra deps).
    # Fully headless — no Godot editor/LSP/DAP; the socket protocols are
    # exercised against in-process mock servers on 127.0.0.1.
    strategy:
      fail-fast: false
      matrix:
        node: [ '18', '20', '22' ]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install against the real registry (reproducible)
        run: npm ci
      - name: Compile the suite and run it (node:test)
        run: npm test
      # 🔴 THE GATE ON THE GATE. `_population.mjs` is the only thing standing between
      # fourteen live probes and 169 §4's "…_ALL ok every claim held" — a sentence that
      # is true of the empty set. If the instrument silently stopped counting, all
      # fourteen would go back to reporting coverage they no longer have, in green.
      # No Godot, no ports, no deps: it runs here rather than earning a 27th job.
      # 🆕 242 — THE TWO P0 REPORTERS' SELF-TESTS, AND THEY ARE HERE BECAUSE THEIR
      # ABSENCE COST A SESSION. `p0_complexity.mjs` and `p0_testdup.mjs` shipped tracked
      # in 241 importing `globSync` from `node:fs`, which was exposed in Node 22 — so on
      # the 18 and 20 legs of this very matrix the modules failed to LINK and never ran.
      # They were in no workflow and in no replay list, so 26 CI jobs and eleven bespoke
      # instruments had nothing to say. The matrix is the reader that catches the class.
      - name: The P0 reporters still measure what they claim (complexity)
        run: node scripts/p0_complexity.selftest.mjs
      - name: The P0 reporters still measure what they claim (test duplication)
        run: node scripts/p0_testdup.selftest.mjs
      - name: The population instrument, self-checked
        run: node test-integration/_population.selftest.mjs
      # 🔴 AND THE LEDGER COMPARISON, WHICH UNTIL 173 HAD NO GATE ANYWHERE. The four
      # claims deciding whether the live path cohort and path-cohort-ledger.tsv agree
      # lived inline in `authoring-plane`, a probe that boots the editor GUI under Xvfb,
      # so no case with a known answer had ever been put through them. A blinding
      # harness says nothing about an instrument with no gate — and says it in green.
      # It needs a tool list and a file: no Godot, no ports, no deps.
      - name: The path-cohort ledger comparison, self-checked
        run: node test-integration/_path_ledger.selftest.mjs
      # 🔴 AND THE CLEANUP THAT PROVES ITSELF, WHICH HAD THE SAME GAP ONE FILE OVER.
      # `_workspace.mjs` decides what AUTH_CLEAN's "byte-identical" means, and 174
      # measured it at SIX OF SIX STILL GREEN — every headless gate in the tree passed
      # with the module fully blinded, because it too was imported only by the Xvfb
      # probe. The seam is sharper than the absence: restoreDir decides what to REMOVE
      # from walk(), diffDir decides what APPEARED from walk(), so a blind enumerator
      # means the restore removes nothing AND the check that proves the restore worked
      # reports clean. Real temp dirs, node builtins only: no Godot, no ports, no deps.
      - name: The workspace snapshot/restore/diff, self-checked
        run: node test-integration/_workspace.selftest.mjs
      # 🔴 THE SAME GATE, FOR THE UNIT SUITE. 170 §10.2 asked whether taut169.mjs
      # reporting ZERO tautology candidates against these 47 files was good news or a
      # classifier that does not understand node:test. It was the classifier: its claim
      # finder only recognised bare-identifier callees, so it found zero CLAIM SITES —
      # and its own aggregated SCOPE line hid that collapse behind the probe suite's
      # healthy number. 2602 assertions across 676 blocks had never been swept.
      # No Godot, no ports, no deps: a step here rather than a 27th job.
      - name: The tautology instrument, self-checked
        run: node scripts/tautology_gate.selftest.mjs
      - name: No test block asserts only shape (tautology gate)
        run: node scripts/tautology_gate.mjs
      # 🔴 175. THE PNG READER DECIDES WHAT A RENDERED FRAME IS, AND NOTHING HEADLESS HAD
      # EVER RUN IT. Measured before this step existed: `BLIND175 _png.mjs 2 of 2 STILL
      # GREEN` — both exports replaced with constants and every gate above still passed,
      # because its only two importers are an Xvfb editor probe and a real-GPU script.
      # `sampleDistinctColours` returning >1 IS AUTH_SHOT_NOT_UNIFORM, the check that
      # separates a rasterizer that drew something from one that drew nothing (#143).
      - name: The PNG reader, self-checked
        run: node test-integration/_png.selftest.mjs
      # 🔴 AND THE GATE FOR THE ABSENCE OF A CHECK. 174 §11.3 asked which directories the
      # tautology sweep does not enter; the host root was one, and the classifier read it
      # as SILENT. 171 §2: a silent file either asserts nothing or asserts in an idiom the
      # finder cannot read. Here it was the first — three live drivers fetched a verdict
      # from a `runtime_assert_*` tool, wrote it to a transcript and exited 0 regardless,
      # and one of them printed "buggy FAILS both · fixed PASSES both — automation proves
      # the fix" as a STRING LITERAL with both measurements in hand. The tautology gate
      # cannot pin that: it grades CONDITIONS, and there was no condition to grade
      # (174 §3's division of labour). Steps, not a 27th job — TWELFTH session running.
      - name: The verdict instrument, self-checked
        run: node scripts/verdict_gate.selftest.mjs
      - name: Every recorded verdict is read (verdict gate)
        run: node scripts/verdict_gate.mjs
      # 🔴 AND THE SAME GATE FOR contract_check.py's OWN ENUMERATORS. 171 §10.21 asked
      # what each of them would print if its finder matched nothing. Measured in 172:
      # 25 blindable, 14 could match NOTHING and the run still said ALL HARD CHECKS
      # PASSED — including check 16, which exists BECAUSE checks 6/7 can be driven to
      # zero comparisons, and which floored its universe against the same finder it was
      # protecting. This step blinds each enumerator in turn and asserts the run goes
      # red. A floor never tested against the collapse it names is a claim that cannot
      # fail. ~18s, no Godot, no ports: a step here rather than a 27th job (NINTH
      # session running).
      # 🔴 AND THE TAUTOLOGY THAT LIVES ON THE OTHER SIDE OF THE BRIDGE — 177 §4.
      # `_filesystem_scan` returns `_ok({"scanning": true})` unconditionally and the
      # authoring probe asserted `.scanning === true`. Neither half is wrong alone and
      # `tautology_gate.mjs` cannot see it: it grades a claim's LEAVES, and `.scanning`
      # is a property of a value fetched at runtime — the textbook shape of the VALUE
      # claim it is built to pass. The constant is real but it is in GDScript, in another
      # file, on the far side of a JSON hop, and `call()` throws on `isError` so every
      # other return path escapes before the comparison is reached. Four live claims had
      # two outcomes: "true", and "never reached". A step, not a 27th job (FOURTEENTH
      # session running).
      - name: The boundary instrument, self-checked
        run: node scripts/boundary_gate.selftest.mjs
      - name: No claim is compared against a value the addon hard-wires (boundary gate)
        run: node scripts/boundary_gate.mjs
      # 🔴 AND THE DEFECT `_population.mjs`'s OWN SIX GATES STRUCTURALLY CANNOT SEE — 184
      # §5. `seal()` attributes every claim made since the PREVIOUS seal, so a marker
      # written above its own assertions owns the section before it and hands its own to
      # the next one. NOTHING goes unattributed when that happens, so gate 6 — the
      # unsealed count 184 added — is blind to it by construction; what breaks is the
      # report's AIM, one section off. 184 found four instances with a 40-line regex scan
      # that called itself heuristic in its own docstring, fixed them, and left the class.
      # 🔴 AND NO RUNTIME GATE CAN COVER IT EITHER, which is why this is a source scan: a
      # seal drains what has ALREADY happened, so every claim it takes preceded it in
      # time. 185 measured the call-site reading anyway before rejecting it — thirteen
      # assert-making helpers are defined below the first seal of their own file, and a
      # rule reading innermost stack frames would have called every claim they make a
      # violation. Static, ~1s, no Godot and no ports: a step here rather than a 27th job
      # (TWENTY-THIRD session running).
      - name: The seal-order instrument, self-checked
        run: node scripts/seal_order_gate.selftest.mjs
      - name: No marker is written above the claims it describes (seal order gate)
        run: node scripts/seal_order_gate.mjs
      # 🆕 219 — 215 §7.4/§7.5, four sessions after they were named. `assert.deepEqual(
      # wire, [])` passes on a collection that CAN be non-empty and on one that never
      # fills, and only the claim's own UNIT separates them. The reader lived in gitignored
      # scratch for four sessions, in which four separate defects each produced a clean,
      # plausible table (214 §5) — every one is now a refusal row in the self-test, and a
      # mutation sweep caught all eight mutants it claims to catch.
      # 🔴 IT REPORTS THREE ANSWERS FOR "NO", NOT ONE, and that is what made promotion
      # possible: a boolean gate calls a process trap and a floored intersection defects,
      # gets overridden by hand on its first run, and an instrument overridden by hand is
      # one nobody reads (215 §4). Both exemptions are DERIVED from the source — a trap is
      # a collector written only inside a `process.on("uncaughtException"|…)` callback AND
      # floored on a companion binding; without that floor it is `PC_TRAP_UNFLOORED`, which
      # cannot hide inside the defect ceiling. Static, no Godot, no ports, ~2s: a step here
      # rather than a 27th job (FIFTY-SEVENTH session running).
      - name: The positive-control finder, self-checked
        run: node scripts/positive_control_gate.selftest.mjs
      - name: Every emptiness claim is defended, exempt or floored (positive control gate)
        run: node scripts/positive_control_gate.mjs
      - name: Every derived population collapses loudly (scope gate)
        run: python3 ../scripts/scope_gate.py
      # 🔴 AND THE SAME TECHNIQUE POINTED AT THE JS INSTRUMENTS — 172 §10.2, which named
      # `_population.mjs` and the path cohort as the two it had not reached. Measured in
      # 173: `reportOrDie()` could return 0 without reporting or exiting and the
      # population self-test stayed entirely GREEN — and ELEVEN of the fourteen live
      # probes call ONLY that member, so every gate above it was decorative in exactly
      # the probes with no other backstop. ~3s, and it needs dist-test/, which the
      # `npm test` step above has already emitted. A step, not a 27th job (TENTH session).
      # 🔴 182: THE LATE AXIS NEEDS `dist/`, AND `npm test` ONLY EMITS `dist-test/`.
      # The gate's live half runs `scripts/path-cohort.mjs`, which imports `dist/` and
      # spawns the server over stdio — headless, no editor. Without this step the gate
      # REFUSES rather than skipping, which is the whole point: a skipped axis reported
      # in green is the failure it exists to catch, and CI said so on the first run.
      - name: Build dist/ for the instrument gate's live axis
        run: npm run build
      # 🆕 242 — THE LINT ROSTER RUNS AFTER `npm run build`, AND CI IS WHAT TAUGHT IT
      # THAT. Its JS half points `tsc --allowJs --checkJs` at the tracked `.mjs`, and
      # `tsc` follows imports: fourteen probes import `../dist/…`, so on an unbuilt tree
      # every one of those resolves to nothing and the run reports sixty `TS2307 Cannot
      # find module` — a class the roster has never carried, over a population that is
      # perfectly healthy. The gate refused on its first CI run for a reason that was
      # true of the RUNNER and not of the tree, which is exactly what `pyflakes_absent`
      # exists to stop one language over. `dist_absent()` now says so in one sentence,
      # and this ordering is what keeps it from having to.
      - name: Install the one off-the-shelf Python tool this repository runs
        run: pip install pyflakes
      - name: The lint roster can still refuse (lint ceiling selftest)
        run: python3 ../scripts/lint_ceiling.py --selftest
      - name: No new class of linter finding in either language, and no declared class
          grew (lint ceiling)
        run: python3 ../scripts/lint_ceiling.py
      - name: Every JS instrument collapses loudly (instrument gate)
        run: python3 ../scripts/instrument_gate.py
      # 🔴 AND THE LIVE TOOL-SURFACE BUDGET — 206 §4. Needs the dist/ the step above
      # built, and spawns the server over stdio: no editor, no ports. The selftest in the
      # contract-check job proves the constants can refuse; THIS is the one that reads the
      # real surface, and it is the only thing standing between a description edit and the
      # number growing silently. ~3s.
      - name: The tool-surface budget can still refuse (token cost selftest)
        run: node scripts/token-cost.selftest.mjs
      - name: The tool surface is within its declared budget (token cost)
        run: node scripts/token-cost.mjs --summary
      # 🆕 209 §2 — CHECK 8's CLASSIFIER, AND ONLY ITS PURE HALF RUNS HERE. The live half
      # builds a baseline tag in a throwaway worktree and drives two servers over stdio;
      # it belongs to the release cut, which is the only moment a baseline ref means
      # anything. But a check that runs ONLY at release time has been audited only at
      # release time — so the classifier's nineteen rows, its collapse floor and its
      # normalisers are proved here, on every push, with no worktree and no tags. Same
      # split `registry_lag.py --selftest` uses one job over. ~1s. A step, not a 27th job.
      - name: The release wire classifier can still refuse (wire diff selftest)
        run: node scripts/wire_diff.selftest.mjs
      # 🆕 233 — AND THE HALF THAT NEEDS NO BASELINE, WHICH IS WHY IT CAN RUN HERE. The
      # classifier compares two schemas by NAME, and `typeName` builds that name out of a
      # thirteen-keyword roster — so a keyword the roster omits makes two different schemas
      # one string and turns a MAJOR into `PATCH`. This asks the wire what keys it actually
      # carries and refuses one nothing reads. One server start against the `dist/` built
      # above, no worktree, no tags. ~3s.
      - name: Every key on the wire is one the classifier can read (wire diff discover)
        run: node scripts/wire_diff.mjs --discover
      # 🆕 234 §1 — THE READER FOR THE ONE TABLE IN THIS TREE NOTHING READ BACK. A
      # handoff's status block is two dozen claims about what these gates printed, it is
      # the first thing the next session stands on, and `FLOOR_PIN_LITERAL` was restated
      # wrongly in two consecutive blocks — the second by the session that caught the
      # first and wrote the paragraph about it. The handoffs are not tracked, so CI cannot
      # check a real one; what it CAN check is that the reader still parses, still binds
      # every atom of seven real blocks to exactly one instrument, and still refuses an
      # ambiguous roster. The live half is an authoring step (`tree_quiet.py`'s shape).
      # ~1s, no build, no server.
      - name: The handoff reader still reads (handoff gate self-test)
        run: python3 ../scripts/handoff_gate.py --selftest
      # 🆕 237 §1 — AND THE HALF THE SELF-TEST DECLARES OUT OF SCOPE. `--selftest`
      # measures nothing on purpose: `handoff.claims` runs it as a subprocess to read its
      # own counter back, so a self-test that measured would recurse. Correct, and it
      # leaves eighteen patterns asserted against nothing — 236 §5 anchored `lint.files`
      # on a header line its instrument had stopped printing on one of its two paths, and
      # the only thing that ever found it was a container without `pyflakes`. This step
      # runs each CHEAP and LOCKED instrument and reads its real output back through the
      # real pattern. It is a fresh checkout with no `pyflakes`, which is exactly the
      # machine the shipped anchor could not read — so the refusal path is the one CI
      # takes. The MUTATING rows stay UNCOVERED here and the step SAYS which. ~20s.
      - name: Each reader's pattern still matches its instrument (handoff gate patterns)
        run: python3 ../scripts/handoff_gate.py --patterns
      # 🆕 231 §2 — AND THE READER FOR WHAT CHECK 8 CANNOT SEE. `wire_diff.mjs` compares
      # two `tools/list` payloads, so a validation rule neither payload carries is outside
      # it by construction — 230 §4 measured one such rule live (`.finite()` on
      # runtime_assert_perf's `baseline`, which emits `{"type":"number"}` either way). The
      # roster reads the ZOD rather than the wire and names the SITE rather than counting
      # the population, because a count goes green when one site is deleted and another
      # appears. The selftest is pure and runs first; the live half needs the dist/ built
      # above. ~1s each.
      - name: The wire-invisible roster can still refuse (wire invisible selftest)
        run: node scripts/wire_invisible_gate.selftest.mjs
      - name: Every refinement the emitter drops is rostered at its site (wire invisible gate)
        run: node scripts/wire_invisible_gate.mjs
      # 🔴 AND THE THIRD TECHNIQUE, POINTED AT THE FLOORS THE OTHER TWO REST ON — 180
      # §11.3. 180 §7.3 set `SELFTEST_CLAIM_FLOOR = 0` in one self-test and the file
      # stayed green; the sweep behind this step asked every floor in the tree the same
      # question and SIX of twenty-five answered the same way, four of them the tautology
      # gate's own directory floors, whose roster was pinned by KEY and never by value.
      # A floor cannot be covered by the live reverse sweep for 180 §8's reason — it is
      # reachable only from below and the tree is above it by construction — so this is
      # the only place the coverage can live. ~40s. A step, not a 27th job (EIGHTEENTH
      # session running).
      - name: Every floor's own value is pinned (floor pin gate)
        run: python3 ../scripts/floor_pin_gate.py
      # 🔴 AND THE FOURTH, POINTED AT THE STATEMENTS THE OTHER THREE CANNOT REACH — 182
      # §11.3, measured in 186 and closed here. `CHECKS_RUN 20/20` counts BLOCKS that
      # reach their own end; 186 counted the failure STATEMENTS inside those blocks and
      # got 23 of 70 ever executed by anything, with FIVE WHOLE CHECKS — 17, 22, 3, 11c
      # and `host` — at zero. A statement that only runs when the tree is broken cannot
      # be covered by a run over a healthy tree, at any resolution: it needs a POSITIVE
      # control, a mutation that makes exactly that statement fire. Seventeen of them,
      # each asserted to redden contract_check, to reach the report (181's discriminator)
      # and to print the one statement it names. ~60s, and it mutates the working tree,
      # so it runs after every gate above it. A step, not a 27th job (TWENTY-FIFTH
      # session running).
      - name: Every check at zero can actually fail (control gate)
        run: python3 ../scripts/control_gate.py
      # 🆕 225 — 224 §6.6: two mutating gates run at once rewrote each other's tree and
      # produced a red that was entirely the harness. This is the LAST gate step because
      # it spawns the four above it to prove each refuses while the lock is held; each
      # child exits in ~40ms because the refusal happens before any work.
      # 🆕 228 — THE READER'S OWN TABLE, AND IT IS THE SMALLER OF THE TWO CLAIMS. This
      # step proves `tree_quiet.py` can classify thirteen fixtures; it says nothing about
      # whether any reader consults it. The step BELOW is the one that does — the
      # mutation-lock gate spawns this file, and `.githooks/pre-commit`, against a real
      # held lock on this tree. 227 §15 is the whole reason both lines are here and the
      # difference between them is written down.
      - name: The tree-quiet reader can still refuse (tree quiet selftest)
        run: python3 ../scripts/tree_quiet.py --selftest
      - name: The mutation-lock deriver can still refuse (mutation lock selftest)
        run: python3 ../scripts/mutation_lock_gate.py --selftest
      - name: Every tree mutator takes the lock, closes its record, and every reader refuses beside one (mutation lock gate)
        run: python3 ../scripts/mutation_lock_gate.py
