name: sdk-drift

# Early-warning companion to ci.yml. Rebuilds against the LATEST
# @modelcontextprotocol/sdk in range (ignoring the lockfile), so an upstream
# release that tightens types — exactly the class of failure that hit
# ToolResult — is caught here on a schedule instead of by a contributor's PR.
#
# Informational: keep it OUT of required status checks. When it goes red, the
# next SDK bump will need a code change; reproduce locally with the same steps.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  latest-sdk-build:
    name: build against newest @modelcontextprotocol/sdk in range
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fresh install — newest version satisfying package.json (no lockfile)
        run: rm -f package-lock.json && npm install --no-audit --no-fund
      - name: Show what resolved
        run: npm ls @modelcontextprotocol/sdk || true
      - name: Build against it
        run: npm run build

  # 🆕 279 — 🔴 THE JOB ABOVE CANNOT SEE THE ONE THING IT WAS BUILT FOR.
  # It rebuilds against the newest version IN RANGE, and a range cannot contain a new
  # major. The TypeScript SDK's version 2 shipped on 2026-07-27 as
  # @modelcontextprotocol/core, /server, /client, /node and /express — published from the
  # same repository, while @modelcontextprotocol/sdk stayed on its 1.x — and the early
  # warning built for exactly this class was structurally blind to it for four weeks,
  # while `sdk-v2-migration` (226) was re-targeted five times against the one package
  # name the row happened to type.
  #
  # The population is DERIVED: every package the registry serves from the same repository
  # as the dependency host/package.json actually pins. It is its own job because a red
  # here means UPSTREAM moved, which is a different fact from the landscape job below and
  # from anything this repository owes its own registry.
  upstream-major:
    name: no newer major upstream than this tree pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: The registry serves no major the tree does not pin
        run: python3 scripts/registry_lag.py --upstream

  # 🆕 224 — THE TWO READERS THAT NEED THE NETWORK, ON THE ONLY SCHEDULE THAT CAN
  # AFFORD THEM. `assetlib_sweep.py --check` shipped in 223 and was wired to nothing
  # (223 §6.13, "SIXTY-FIRST SESSION RUNNING"); `spec_conformance.py --refresh` asks
  # whether the checked-in method ledger still matches the specification repository.
  # Both dial third-party hosts, so neither belongs in the merge path — a landscape
  # reader that can fail because godotengine.org is slow is a flaky gate, and this
  # workflow is already the declared home for informational early warning. The
  # OFFLINE halves of both are merge-blocking in ci.yml; these are the halves that
  # tell us the offline data has gone stale.
  landscape-drift:
    name: landscape + spec ledger still match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: The MCP method ledger still matches the specification repository
        run: python3 scripts/spec_conformance.py --refresh
      # 🆕 291 — THE EMITTER RUNS FIRST, AND IT RUNS EVEN WHEN THE CHECK WILL REFUSE.
      # Three of the four channels answer from nowhere in this project's own toolchain —
      # the Cowork container gets HTTP 403 from its egress proxy for godotengine.org and
      # registry.npmjs.org alike, and the device VM has no network at all — so a reading
      # taken on a runner that CAN dial is the only place the numbers exist. One line per
      # fact, `--gh-open`'s contract since 271, so the log of this job is a measured
      # directory a later session can spend rather than a report it has to re-take.
      - name: Emit the world-facing landscape readings
        run: python3 scripts/assetlib_sweep.py --emit
      # 🆕 308 — THE ONE RED LIGHT BECOMES THREE ANSWERS, AND ACTIONS NEEDS TELLING.
      # `--check` now returns 2 when a leg of the sweep did not finish, 1 when a project
      # has appeared with no roster row, and 0 when the only news is that projects the
      # roster already names have moved. Actions fails a step on ANY nonzero, so splitting
      # the Python return values alone would change nothing a person looking at the run
      # can see — the `case` below is the half that makes the colour mean something, and
      # the titles are what a notification carries without anybody opening the log.
      - name: The roster still covers every project every channel surfaces
        run: |
          set +e
          python3 scripts/assetlib_sweep.py --check
          code=$?
          set -e
          case "$code" in
            0)
              echo "::notice title=Roster green::Nothing is owed. Any movement printed above is a tracked project that the roster already names."
              ;;
            1)
              echo "::error title=The roster owes a row::A project has appeared in a sweep with no roster row. One row each closes them, and a row that exists does not come back."
              exit 1
              ;;
            2)
              echo "::error title=The sweep could not read the world::A discovery or source leg did not finish, so nothing this run read can be spent as 'nothing has moved'. This is a defect in the sweep, not news about the world."
              exit 1
              ;;
            *)
              # 🔴 THE MESSAGE MUST NOT SPELL THE COMMAND. `handoff_gate.py --patterns`
              # reads workflow TEXT and compares BASENAMES (241's defect, one
              # resolution finer), so an error string containing `<gate>.py --flag`
              # is read as an invocation the replay fence never ran and the close
              # refuses. That is this session's own lesson — a raw-text reader
              # fooled by a string literal — in the fence reader itself. Named here
              # because the next person writing a helpful error message will hit it.
              echo "::error title=The sweep exited a code nobody declared::The roster check exited $code, which is not 0, 1 or 2."
              exit 1
              ;;
          esac
