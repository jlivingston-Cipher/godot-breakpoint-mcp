name: sdk-drift

# Early-warning companion to ci.yml. Rebuilds against the LATEST
# @modelcontextprotocol/sdk in range (ignoring the lockfile), so an upstream
# release that tightens types — exactly the class of failure that hit
# ToolResult — is caught here on a schedule instead of by a contributor's PR.
#
# Informational: keep it OUT of required status checks. When it goes red, the
# next SDK bump will need a code change; reproduce locally with the same steps.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  latest-sdk-build:
    name: build against newest @modelcontextprotocol/sdk in range
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Fresh install — newest version satisfying package.json (no lockfile)
        run: rm -f package-lock.json && npm install --no-audit --no-fund
      - name: Show what resolved
        run: npm ls @modelcontextprotocol/sdk || true
      - name: Build against it
        run: npm run build

  # 🆕 279 — 🔴 THE JOB ABOVE CANNOT SEE THE ONE THING IT WAS BUILT FOR.
  # It rebuilds against the newest version IN RANGE, and a range cannot contain a new
  # major. The TypeScript SDK's version 2 shipped on 2026-07-27 as
  # @modelcontextprotocol/core, /server, /client, /node and /express — published from the
  # same repository, while @modelcontextprotocol/sdk stayed on its 1.x — and the early
  # warning built for exactly this class was structurally blind to it for four weeks,
  # while `sdk-v2-migration` (226) was re-targeted five times against the one package
  # name the row happened to type.
  #
  # The population is DERIVED: every package the registry serves from the same repository
  # as the dependency host/package.json actually pins. It is its own job because a red
  # here means UPSTREAM moved, which is a different fact from the landscape job below and
  # from anything this repository owes its own registry.
  upstream-major:
    name: no newer major upstream than this tree pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: The registry serves no major the tree does not pin
        run: python3 scripts/registry_lag.py --upstream

  # 🆕 224 — THE TWO READERS THAT NEED THE NETWORK, ON THE ONLY SCHEDULE THAT CAN
  # AFFORD THEM. `assetlib_sweep.py --check` shipped in 223 and was wired to nothing
  # (223 §6.13, "SIXTY-FIRST SESSION RUNNING"); `spec_conformance.py --refresh` asks
  # whether the checked-in method ledger still matches the specification repository.
  # Both dial third-party hosts, so neither belongs in the merge path — a landscape
  # reader that can fail because godotengine.org is slow is a flaky gate, and this
  # workflow is already the declared home for informational early warning. The
  # OFFLINE halves of both are merge-blocking in ci.yml; these are the halves that
  # tell us the offline data has gone stale.
  landscape-drift:
    name: landscape + spec ledger still match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: The MCP method ledger still matches the specification repository
        run: python3 scripts/spec_conformance.py --refresh
      - name: The Asset Library roster still covers every MCP-shaped entry
        run: python3 scripts/assetlib_sweep.py --check
