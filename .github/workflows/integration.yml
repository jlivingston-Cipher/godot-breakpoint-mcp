name: integration

# Real host <-> Godot integration tests. Installs a Godot binary on the runner
# and exercises the host against a LIVE engine — the one thing the unit suite
# (which mocks the sockets) deliberately cannot do, and that no competitor's CI
# is known to do either.
#
#   * gdscript-unit — headless, deterministic. Runs the addon's editor-free GDScript unit suite
#                     (example/tests/ops_unit_test.gd) directly under Godot: the variant_json codec
#                     round-trips plus the pure operations.gd helpers (envelope, _resolve/_path_of,
#                     _serialize_node/_descendants, doc-URL/type-name, _ping). No editor / bridge /
#                     GUI — it complements the authoring-plane, which covers the editor-COUPLED
#                     handlers. Also runs the Group N scene-construction smokes (card_build_smoke.gd,
#                     board_build_smoke.gd, piece_build_smoke.gd, interact_build_smoke.gd, card_setface_smoke.gd,
#                     board_tile_smoke.gd) — build → pack → round-trip a card / board / piece / tile-board PackedScene,
#                     compile + round-trip the interaction behaviour scripts, round-trip + play the card-flip animation,
#                     and check board_tile_place's coordinate math against the engine's map_to_local. Also runs
#                     editable_instance_smoke.gd (Finding-A) — proves a sealed sub-scene reverts overrides on reload
#                     while an editable-instance persists them (the card_instance persist:true mechanism). Also runs
#                     bridge_auth_smoke.gd — the default-on loopback shared-secret handshake (pre-auth denied, wrong
#                     secret denied, correct secret authenticates; constant-time compare).
#                     Gates on the OPS_UNIT / CARD_BUILD / BOARD_BUILD / PIECE_BUILD / INTERACT_BUILD / CARD_SETFACE / BOARD_TILE / EDITABLE_INSTANCE / BRIDGE_REENTRANCY / BRIDGE_AUTH _SUMMARY / _FAIL markers.
#   * cli-plane     — headless, deterministic, expected to pass. This is the gate.
#   * runtime-plane — boots the example GAME headless (no editor, no GUI) and drives Plane C
#                     against its in-game BreakpointRuntimeBridge autoload (:9081). Asserts D6
#                     zero-config console capture: a live print() reaches runtime_get_log via
#                     the scriptable Logger. MATRIX across 4.3 (below the 4.5 floor — capture is a
#                     documented no-op: bridge loads, print() absent, push_log still served), 4.5
#                     (the floor where OS.add_logger was introduced) and 4.7 (newest stable) — on
#                     4.5/4.7 the print() must be captured. Headless & deterministic like cli-plane
#                     (no Xvfb/GPU), and — like cli-plane — a REQUIRED gate: all three arms must pass.
#                     Then boots two further games on their own ports, because both need a scene
#                     main.tscn cannot provide: res://tests/frame_step_probe.tscn on :9082 for the F4
#                     deterministic frame-step lane (freeze -> step EXACTLY N -> stay frozen), and
#                     res://tests/verify_probe.tscn on :9084 for the VERIFICATION FAMILY —
#                     assert_node_state / _scene_structure / _perf / _screen_text and state_digest,
#                     which had unit tests against a mocked bridge and no live coverage at all.
#                     Everything worth testing in that family is GDScript on the far side of the
#                     socket, so every check is made in BOTH directions and three are unsatisfiable
#                     by a static implementation: `counter` is changed live and the same assertion
#                     must flip; a hidden label's text must NOT be found while assert_node_state
#                     proves that node holds it (absence vs invisibility); and assert_perf is driven
#                     past the bound as both higher_better and lower_better. Markers VERIFY_LIVE_*.
#                     Then a FOURTH game on :9085, res://tests/anim_probe.tscn, for the ANIMATION
#                     LANE — runtime_anim_play / _stop / _get_state, which the §6.5 audit found
#                     unit-test-only because no scene in this repo held an AnimationPlayer at all.
#                     The animation MOVES a node, read back through runtime_get_property, so a
#                     reported playing:true is not enough; keep_state is proved by the playhead
#                     (pause keeps it, stop rewinds it) — which is where _anim_stop's written claim
#                     that pause()/stop() are stable across 4.2-4.5 finally gets checked, on all
#                     three arms; custom_speed is measured over equal windows rather than trusted;
#                     and from_end is proved on the NON-looping animation, the only one where
#                     starting at the end is observable. Markers ANIM_LIVE_*.
#   * runtime-render-plane — the same live GAME as runtime-plane, but rendered by a rasterizer that
#                     actually DRAWS (Xvfb + Mesa llvmpipe, no --headless), so the two pixel-producing
#                     runtime tools finally execute: runtime_screenshot and runtime_screenshot_diff.
#                     Boots res://tests/render_probe.tscn — a 400x400 red patch, deliberately NOT the
#                     uniform frame res://main.tscn produces — then toggles the patch's visibility and
#                     asserts the diff over a KNOWN pixel set: full frame ~0.2143, a region inside the
#                     patch 1.0, a region outside it 0.0. No single constant satisfies all three, which
#                     is what separates this from a job that is green without comparing anything.
#                     Markers RENDER_LIVE_*. Like render-plane, a degraded capture (no_image /
#                     no_texture) is an ERROR here, not the graceful skip it is everywhere else.
#   * peers-plane   — F6 multi-peer determinism, headless. The ONLY job here that boots no game for
#                     itself and needs no editor: runtime_spawn_peers spawns its own headless children
#                     through the shipped PeerRegistry, each on an allocated loopback port. Freezes,
#                     equalises, seeds and steps three REAL peers, then asserts runtime_peers_digest
#                     reports them BYTE-EQUAL under a deliberately adversarial 250 ms stagger between
#                     each peer's seed and its step — the convergence claim carried in that tool's own
#                     description, turned from validated-once into run-every-PR. Carries its own
#                     NEGATIVE control (skew one peer; divergence must be reported AND localised to the
#                     node that disagrees), because a convergence check that cannot report divergence
#                     verifies nothing — plus the four-peer ceiling, peer_stop against a real child, and
#                     idempotent re-stop. Also pins the mechanism behind the preconditions: across a
#                     frozen window the idle lane keeps firing while the delta-guarded physics lane
#                     holds. Uses the DEFAULT-ON auth handshake (no BREAKPOINT_BRIDGE_INSECURE) — the
#                     host mints the project secret and every child authenticates with it against the
#                     real bridge_secret.gd, which is the only place that path runs end to end in CI.
#                     MATRIX across 4.3-stable and 4.7-stable, and convergence is MEASURED on BOTH —
#                     three peers byte-equal under the stagger on each — so the claim is not a 4.3
#                     accident. EXPERIMENTAL / continue-on-error anyway, and the reason is the RUNNER
#                     rather than the engine: it is the first job to run three simultaneous headless
#                     engines on a shared runner. Promote it the way runtime-plane (session 20),
#                     csharp-plane (25) and authoring-plane (42) each were — once it is green across a
#                     few real runs, on evidence rather than speculatively.
#                     Gates on the F6_PEERS_* markers via the probe's exit status.
#   * editor-plane — boots the editor GUI under Xvfb and hits the built-in LSP. Runs as a
#                    MATRIX across the 4.3 baseline and the newest stable (4.7): the D7_CAPS /
#                    D7_WS_RAW markers answer whether workspace/symbol and the other
#                    advertised-but-dead-on-4.3 LSP providers return results on a modern build.
#                    Also runs the D3 resource-subscription probe (D3_SUB_* markers): a live
#                    selection change over the addon bridge must push notifications/resources/updated.
#                    EXPERIMENTAL: runs under continue-on-error while the GUI-boot
#                    timing is tuned on real runners, so it never blocks a merge.
#   * dap-plane    — boots the same editor GUI under Xvfb and connects to its built-in
#                    Debug Adapter (DAP, :6006): runs the initialize handshake, dumps
#                    the adapter's advertised capabilities (D_DAP_CAPS / D_DAP_FILTERS —
#                    the "D-DAP" probe), and best-effort launches the example scene to a
#                    breakpoint. Runs as a MATRIX across the 4.3 baseline and the newest
#                    stable (4.7) so the D_DAP_* markers reveal which advertised-but-dead-
#                    on-4.3 capabilities light up on a modern build. Also EXPERIMENTAL /
#                    continue-on-error (never blocks).
#   * csharp-plane  — D4 C1 + C2 + C3. Downloads a Mono/.NET Godot build + the .NET SDK and boots the
#                     C# fixture (example-csharp/) headless: dotnet-builds the project, imports +
#                     --build-solutions, then asserts the C# scene's _Ready() ran (C#_PLANE_BOOT_OK).
#                     C2: also installs OmniSharp and runs a live cs_* LSP probe against it over the
#                     fixture (markers C#_LSP_*: reached, capabilities, per-tool probes). C3: installs
#                     netcoredbg and runs a live cs_dbg_* DAP probe (markers C#_DAP_*: initialize gate
#                     reached + capabilities, then a best-effort launch-to-breakpoint flow — log-only,
#                     as the netcoredbg + Godot native-host attach story is being established).
#                     Now a REQUIRED gate (session 25): the fixture build, live OmniSharp cs_* LSP
#                     probe and the netcoredbg initialize gate must pass — the launch-to-breakpoint
#                     flow past C#_DAP_REACHED stays log-only. Promoted from experimental the way
#                     runtime-plane was in session 20. See docs/D4_CSHARP_PLAN.md.
#   * authoring-plane — boots the editor GUI under Xvfb (like editor-plane) and drives the Groups A-G
#                     authoring mutators against the addon bridge (:9080), asserting each mutation by
#                     reading the live edited scene back through separate read tools — plus forward +
#                     undo/redo round-trips wherever the mutation is scene-undoable (markers AUTH_NODE_* /
#                     AUTH_SCENE_* / AUTH_SIGNAL_* / AUTH_RESOURCE_* / AUTH_ANIM_* / AUTH_TILESET_* /
#                     AUTH_TILEMAP_* / AUTH_PHYS_* / AUTH_VFX_* / AUTH_AUDIO_* / AUTH_UNDO_* / AUTH_REDO_* / AUTH_UI_* /
#                     AUTH_SHOT_*, the last being the only pixel-producing tool any job in this repo touches
#                     — and the only family here that opens the payload rather than reading the tool's own
#                     label: AUTH_SHOT_IHDR re-reads the dims off the PNG, AUTH_SHOT_DRAWN rejects a frame
#                     that is a single flat colour (session 147);
#                     AUTH_SUMMARY pass=191/191, measured, session 149). Single newest-stable arm — the A-G authoring surface is
#                     version-stable, unlike the LSP/DAP planes that matrix 4.3/4.7 for capability
#                     divergence. A REQUIRED gate as of session 42 (promoted the runtime-plane /
#                     csharp-plane way once green across a few runs); disk-backed resource_* / filesystem_* /
#                     TileSet .tres writers assert forward-only (not scene-undoable).
#
# Kept separate from ci.yml so a flaky live-engine step can never gate the fast,
# deterministic build/test/contract checks.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Standard (non-mono) Godot build — enough for the GDScript planes. Bump as needed.
  GODOT_VERSION: "4.3-stable"

jobs:
  gdscript-unit:
    name: GDScript unit tests (addon pure logic, headless)
    runs-on: ubuntu-latest
    # Pure, editor-free GDScript (the variant_json codec + operations.gd helpers):
    # fully headless, no Xvfb/GPU, deterministic — the same tier as cli-plane. No
    # host build needed; it runs the addon scripts directly under Godot.
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot (standard linux build)
        run: |
          set -eux
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Run the addon unit suite
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/ops_unit_test.gd > /tmp/ops-unit.log 2>&1 || true
          echo "=== ops_unit_test.gd output ==="
          cat /tmp/ops-unit.log
          echo "==============================="
          # The OPS_UNIT_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "OPS_UNIT_SUMMARY" /tmp/ops-unit.log || { echo "::error::ops_unit_test.gd produced no OPS_UNIT_SUMMARY (script error?)"; exit 1; }
          if grep -q "OPS_UNIT_FAIL" /tmp/ops-unit.log; then echo "::error::a GDScript unit assertion failed"; exit 1; fi
          echo "GDScript unit suite passed: $(grep -o 'OPS_UNIT_SUMMARY.*' /tmp/ops-unit.log)"
      - name: Run the Group N card-build smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/card_build_smoke.gd > /tmp/card-smoke.log 2>&1 || true
          echo "=== card_build_smoke.gd output ==="
          cat /tmp/card-smoke.log
          echo "=================================="
          # CARD_BUILD_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "CARD_BUILD_SUMMARY" /tmp/card-smoke.log || { echo "::error::card_build_smoke.gd produced no CARD_BUILD_SUMMARY (script error?)"; exit 1; }
          if grep -q "CARD_BUILD_FAIL" /tmp/card-smoke.log; then echo "::error::a card-build smoke assertion failed"; exit 1; fi
          echo "Card-build smoke passed: $(grep -o 'CARD_BUILD_SUMMARY.*' /tmp/card-smoke.log)"
      - name: Run the editable-instance (Finding-A save-persistence) smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/editable_instance_smoke.gd > /tmp/ei-smoke.log 2>&1 || true
          echo "=== editable_instance_smoke.gd output ==="
          cat /tmp/ei-smoke.log
          echo "========================================="
          # EDITABLE_INSTANCE_* markers are the source of truth (headless --script
          # exit codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "EDITABLE_INSTANCE_SUMMARY" /tmp/ei-smoke.log || { echo "::error::editable_instance_smoke.gd produced no EDITABLE_INSTANCE_SUMMARY (script error?)"; exit 1; }
          if grep -q "EDITABLE_INSTANCE_FAIL" /tmp/ei-smoke.log; then echo "::error::an editable-instance smoke assertion failed"; exit 1; fi
          echo "Editable-instance smoke passed: $(grep -o 'EDITABLE_INSTANCE_SUMMARY.*' /tmp/ei-smoke.log)"
      - name: Run the Group N board-build smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/board_build_smoke.gd > /tmp/board-smoke.log 2>&1 || true
          echo "=== board_build_smoke.gd output ==="
          cat /tmp/board-smoke.log
          echo "==================================="
          # BOARD_BUILD_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "BOARD_BUILD_SUMMARY" /tmp/board-smoke.log || { echo "::error::board_build_smoke.gd produced no BOARD_BUILD_SUMMARY (script error?)"; exit 1; }
          if grep -q "BOARD_BUILD_FAIL" /tmp/board-smoke.log; then echo "::error::a board-build smoke assertion failed"; exit 1; fi
          echo "Board-build smoke passed: $(grep -o 'BOARD_BUILD_SUMMARY.*' /tmp/board-smoke.log)"
      - name: Run the Group N piece-build smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/piece_build_smoke.gd > /tmp/piece-smoke.log 2>&1 || true
          echo "=== piece_build_smoke.gd output ==="
          cat /tmp/piece-smoke.log
          echo "==================================="
          # PIECE_BUILD_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "PIECE_BUILD_SUMMARY" /tmp/piece-smoke.log || { echo "::error::piece_build_smoke.gd produced no PIECE_BUILD_SUMMARY (script error?)"; exit 1; }
          if grep -q "PIECE_BUILD_FAIL" /tmp/piece-smoke.log; then echo "::error::a piece-build smoke assertion failed"; exit 1; fi
          echo "Piece-build smoke passed: $(grep -o 'PIECE_BUILD_SUMMARY.*' /tmp/piece-smoke.log)"
      - name: Run the Group N interact-build smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/interact_build_smoke.gd > /tmp/interact-smoke.log 2>&1 || true
          echo "=== interact_build_smoke.gd output ==="
          cat /tmp/interact-smoke.log
          echo "====================================="
          # INTERACT_BUILD_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "INTERACT_BUILD_SUMMARY" /tmp/interact-smoke.log || { echo "::error::interact_build_smoke.gd produced no INTERACT_BUILD_SUMMARY (script error?)"; exit 1; }
          if grep -q "INTERACT_BUILD_FAIL" /tmp/interact-smoke.log; then echo "::error::an interact-build smoke assertion failed"; exit 1; fi
          echo "Interact-build smoke passed: $(grep -o 'INTERACT_BUILD_SUMMARY.*' /tmp/interact-smoke.log)"

      - name: Run the Group N card-set-face smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/card_setface_smoke.gd > /tmp/setface-smoke.log 2>&1 || true
          echo "=== card_setface_smoke.gd output ==="
          cat /tmp/setface-smoke.log
          echo "====================================="
          # CARD_SETFACE_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "CARD_SETFACE_SUMMARY" /tmp/setface-smoke.log || { echo "::error::card_setface_smoke.gd produced no CARD_SETFACE_SUMMARY (script error?)"; exit 1; }
          if grep -q "CARD_SETFACE_FAIL" /tmp/setface-smoke.log; then echo "::error::a card-set-face smoke assertion failed"; exit 1; fi
          echo "Card-set-face smoke passed: $(grep -o 'CARD_SETFACE_SUMMARY.*' /tmp/setface-smoke.log)"

      - name: Run the Group N board-tile smoke
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/board_tile_smoke.gd > /tmp/board-tile-smoke.log 2>&1 || true
          echo "=== board_tile_smoke.gd output ==="
          cat /tmp/board-tile-smoke.log
          echo "====================================="
          # BOARD_TILE_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "BOARD_TILE_SUMMARY" /tmp/board-tile-smoke.log || { echo "::error::board_tile_smoke.gd produced no BOARD_TILE_SUMMARY (script error?)"; exit 1; }
          if grep -q "BOARD_TILE_FAIL" /tmp/board-tile-smoke.log; then echo "::error::a board-tile smoke assertion failed"; exit 1; fi
          echo "Board-tile smoke passed: $(grep -o 'BOARD_TILE_SUMMARY.*' /tmp/board-tile-smoke.log)"

      - name: Run the bridge re-entrancy regression (Finding D — scene.save crash guard)
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/bridge_reentrancy_smoke.gd > /tmp/bridge-reentrancy.log 2>&1 || true
          echo "=== bridge_reentrancy_smoke.gd output ==="
          cat /tmp/bridge-reentrancy.log
          echo "====================================="
          # BRIDGE_REENTRANCY_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "BRIDGE_REENTRANCY_SUMMARY" /tmp/bridge-reentrancy.log || { echo "::error::bridge_reentrancy_smoke.gd produced no BRIDGE_REENTRANCY_SUMMARY (script error?)"; exit 1; }
          if grep -q "BRIDGE_REENTRANCY_FAIL" /tmp/bridge-reentrancy.log; then echo "::error::a bridge re-entrancy assertion failed"; exit 1; fi
          echo "Bridge re-entrancy regression passed: $(grep -o 'BRIDGE_REENTRANCY_SUMMARY.*' /tmp/bridge-reentrancy.log)"

      - name: Run the loopback-bridge auth handshake smoke (default-on shared secret)
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/bridge_auth_smoke.gd > /tmp/bridge-auth.log 2>&1 || true
          echo "=== bridge_auth_smoke.gd output ==="
          cat /tmp/bridge-auth.log
          echo "====================================="
          # BRIDGE_AUTH_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "BRIDGE_AUTH_SUMMARY" /tmp/bridge-auth.log || { echo "::error::bridge_auth_smoke.gd produced no BRIDGE_AUTH_SUMMARY (script error?)"; exit 1; }
          if grep -q "BRIDGE_AUTH_FAIL" /tmp/bridge-auth.log; then echo "::error::a bridge-auth handshake assertion failed"; exit 1; fi
          echo "Bridge-auth handshake smoke passed: $(grep -o 'BRIDGE_AUTH_SUMMARY.*' /tmp/bridge-auth.log)"

      - name: Run the Pause Agent latch smoke (addon control surface)
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/pause_latch_smoke.gd > /tmp/pause-latch.log 2>&1 || true
          echo "=== pause_latch_smoke.gd output ==="
          cat /tmp/pause-latch.log
          echo "====================================="
          # PAUSE_LATCH_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "PAUSE_LATCH_SUMMARY" /tmp/pause-latch.log || { echo "::error::pause_latch_smoke.gd produced no PAUSE_LATCH_SUMMARY (script error?)"; exit 1; }
          if grep -q "PAUSE_LATCH_FAIL" /tmp/pause-latch.log; then echo "::error::a pause-latch assertion failed"; exit 1; fi
          echo "Pause Agent latch smoke passed: $(grep -o 'PAUSE_LATCH_SUMMARY.*' /tmp/pause-latch.log)"
      - name: Run the status-dock layout regression (issue #124 — dock must fit its slot)
        run: |
          set -eu
          "$GODOT_BIN" --headless --path "${{ github.workspace }}/example" \
            --script res://tests/status_dock_layout_smoke.gd > /tmp/dock-layout.log 2>&1 || true
          echo "=== status_dock_layout_smoke.gd output ==="
          cat /tmp/dock-layout.log
          echo "=========================================="
          # DOCK_LAYOUT_* markers are the source of truth (headless --script exit
          # codes can be unreliable): require the summary, and fail on any FAIL.
          grep -q "DOCK_LAYOUT_SUMMARY" /tmp/dock-layout.log || { echo "::error::status_dock_layout_smoke.gd produced no DOCK_LAYOUT_SUMMARY (script error?)"; exit 1; }
          if grep -q "DOCK_LAYOUT_FAIL" /tmp/dock-layout.log; then echo "::error::the status dock no longer fits an editor dock slot (issue #124 regression)"; exit 1; fi
          echo "Status-dock layout regression passed: $(grep -o 'DOCK_LAYOUT_SUMMARY.*' /tmp/dock-layout.log)"

  cli-plane:
    name: CLI plane vs real Godot (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot (standard linux build)
        run: |
          set -eux
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: CLI-plane integration smoke
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
        run: node test-integration/cli.integration.mjs

  runtime-plane:
    name: runtime plane vs real game (headless)
    runs-on: ubuntu-latest
    # A required gate, like cli-plane: headless & deterministic (no Xvfb/GPU), so a live-engine flake
    # can't hide a real regression. All three matrix arms must pass; added to branch protection.
    strategy:
      fail-fast: false        # the 4.3 (no-op), 4.5 (capture floor) and 4.7 (newest) arms are independent
      matrix:
        godot: [ "4.3-stable", "4.5-stable", "4.7-stable" ]
    env:
      # Exercise both sides of the D6 capture boundary. 4.5 (the floor where the scriptable Logger /
      # OS.add_logger was introduced) and 4.7 (newest stable): a live print() must be captured into
      # runtime_get_log. 4.3 (below the floor): capture is a documented no-op — the probe asserts the
      # bridge still loads, capture is false, the print() is absent, and push_log entries are still
      # served. Overrides GODOT_VERSION for this job only.
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot (standard linux build)
        run: |
          set -eux
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Boot the game headless and run the D6 capture probe
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # The bridge auth handshake (default-on) is covered by bridge_auth_smoke.gd;
          # this live probe connects without a secret, so disable auth for the boot.
          BREAKPOINT_BRIDGE_INSECURE: '1'
        run: |
          set -eux
          # Plane C runs INSIDE the running game (no editor, no GUI): the runtime autoload opens
          # :9081. Fully headless — no Xvfb / GPU, unlike the editor/dap planes. Boot the game in
          # the background, wait for the port, then run the probe (its exit status gates the step).
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" >/tmp/godot-game.log 2>&1 &
          for i in $(seq 1 40); do
            if node -e "require('net').connect(9081,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "runtime bridge port open"; break
            fi
            sleep 1
          done
          node test-integration/runtime-capture.integration.mjs
      - name: Game log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-game.log || true
      - name: Boot the frame-step probe scene and run the F4 deterministic step probe
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          BREAKPOINT_BRIDGE_INSECURE: '1'
          # A distinct port so this probe game coexists with the D6 capture game above (:9081).
          BREAKPOINT_RUNTIME_PORT: '9082'
        run: |
          set -eux
          # F4: boot the dedicated deterministic-mover scene headless (the autoload opens :9082),
          # wait for the port, then drive freeze -> step N -> assert EXACT advance over the socket.
          # This is the only place the async frame-step lane runs against a real SceneTree.
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" res://tests/frame_step_probe.tscn >/tmp/godot-framestep.log 2>&1 &
          for i in $(seq 1 40); do
            if node -e "require('net').connect(9082,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "frame-step probe port open"; break
            fi
            sleep 1
          done
          node test-integration/runtime-frame-step.integration.mjs
      - name: Frame-step game log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-framestep.log || true
      - name: Boot the verify probe scene and run the verification-family probe
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          BREAKPOINT_BRIDGE_INSECURE: '1'
          # A third distinct port. :9081 is the D6 capture game and :9082 the frame-step
          # game — both still running, backgrounded and never reaped, by the time this
          # starts. :9083 would not actually collide (runtime-render-plane is a different
          # job on a different runner) but it reads like one, so this takes :9084 and
          # every port in this file stays unique.
          BREAKPOINT_RUNTIME_PORT: '9084'
        run: |
          set -eux
          # The verification family (assert_node_state / _scene_structure / _perf /
          # _screen_text, state_digest) had unit tests against a MOCKED bridge and no live
          # coverage at all — #141 closed that gap for runtime_screenshot_diff and nothing
          # else. Everything interesting in this family lives in the GDScript on the far
          # side of the socket: the visibility filter, the MONITORS allow-list, the four
          # structure `reason` values, the digest depth bound. None of it is reachable
          # from a mocked test. Fully headless — nothing here reads a pixel.
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" res://tests/verify_probe.tscn >/tmp/godot-verify.log 2>&1 &
          for i in $(seq 1 40); do
            if node -e "require('net').connect(9084,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "verify probe port open"; break
            fi
            sleep 1
          done
          node test-integration/verification-family.integration.mjs
      - name: Verify-probe game log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-verify.log || true
      - name: Boot the anim probe scene and run the animation-lane probe
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          BREAKPOINT_BRIDGE_INSECURE: '1'
          # A fourth distinct port. :9081 (capture), :9082 (frame-step) and :9084
          # (verification family) are all still running, backgrounded and never
          # reaped, by the time this starts. A fifth step needs a fifth port.
          BREAKPOINT_RUNTIME_PORT: '9085'
        run: |
          set -eux
          # The §6.5 audit after #152 walked all 27 tools in host/src/tools/runtime.ts
          # against host/test-integration/ and found nine with no live coverage. The
          # animation lane was the largest, and the reason nobody noticed is the same
          # one #152 found for _assert_screen_text: THE FIXTURE DID NOT EXIST. No scene
          # in this repo contained an AnimationPlayer, so _resolve_anim_player,
          # _anim_state, _anim_play and _anim_stop had never run anywhere. This is also
          # the only place the cross-version claim in _anim_stop's own comment —
          # pause()/stop() being stable across 4.2-4.5 — is actually checked, which is
          # why it rides this matrix rather than a single arm. Fully headless.
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" res://tests/anim_probe.tscn >/tmp/godot-anim.log 2>&1 &
          for i in $(seq 1 40); do
            if node -e "require('net').connect(9085,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "anim probe port open"; break
            fi
            sleep 1
          done
          node test-integration/animation-lane.integration.mjs
      - name: Anim-probe game log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-anim.log || true

  peers-plane:
    name: peers plane / F6 multi-peer convergence (headless)
    runs-on: ubuntu-latest
    # REQUIRED since session 131, on the evidence the experimental period was there to gather —
    # the same rule that promoted runtime-plane (s20), csharp-plane (s25) and authoring-plane (s42).
    #
    # The open question was the RUNNER, not the engine: this is the only job that boots three
    # simultaneous headless engines on a shared runner. It has now been green on real runners across
    # PRs #116, #118 and #119, on both 4.3-stable and 4.7-stable.
    #
    # Green alone was not taken as evidence, because a `continue-on-error` job reports success even
    # when a step fails — so the run was read rather than trusted. Two checks, both from run
    # 30327122888 (`3e53d0a`):
    #
    #   - the probe cannot pass vacuously. It has no skip path (no `exit(0)` branch, no env guard)
    #     and ends `process.exit(failed ? 1 : 0)` with `failed` set by a catch around the whole body,
    #     and the step below carries no `|| true` — the only `|| true` in this job is on the
    #     --import warm-up, which cannot mask it.
    #   - both arms actually printed F6_PEERS_RESULT, ~3 s after F6_PEERS_SPAWN, with
    #     `converged=true` over three peers on distinct ports. Re-checkable at any time:
    #         gh run view <id> --log | grep -c F6_PEERS_RESULT     # 2 — one per matrix arm
    #
    # `fail-fast: false` stays: the arms are independent, and one engine's flake should not hide the
    # other's result. If this job does turn out to be flaky on shared runners, revert THIS commit
    # rather than re-adding continue-on-error in place — a job that reports success while failing is
    # worse than one that is honestly absent.
    strategy:
      fail-fast: false        # the two arms are independent; neither should cancel the other
      matrix:
        godot: [ "4.3-stable", "4.7-stable" ]
    env:
      # Both arms are measured, not hoped for: three peers byte-equal under the 250 ms stagger on
      # 4.3-stable (the baseline the result was first established on) and on 4.7-stable (the newest
      # stable). The two negative controls — unguarded frozen-frame draws, and an idle lane on the
      # global stream — were measured diverging on 4.3. Overrides GODOT_VERSION for this job only.
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot (standard linux build)
        run: |
          set -eux
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        # Load-bearing here, not boilerplate: the peers are three children of the SAME project, so
        # without a warm .godot/ they would each import on boot and race each other writing it.
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Spawn three real peers and assert convergence (F6_PEERS_* markers)
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # No BREAKPOINT_BRIDGE_INSECURE, deliberately — unlike every other live probe here. Peers
          # are host-launched children, so this is the one job that exercises the default-on
          # handshake for real: the host pre-mints .godot/breakpoint_mcp.secret and each child
          # authenticates against the real bridge_secret.gd. Disabling auth would skip that.
        run: |
          set -eux
          # runtime_spawn_peers boots the children itself, so there is no game to background first.
          # Bounded by an outer timeout so a peer that never binds its port cannot hang the runner;
          # the probe kills every child in a finally block and exits explicitly either way.
          timeout 300 node test-integration/runtime-peers.integration.mjs

  editor-plane:
    name: editor / LSP plane vs real editor (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true   # GUI-boot timing still being tuned; must never block a merge
    strategy:
      fail-fast: false        # one Godot version's probe must not cancel the other
      matrix:
        godot: [ "4.3-stable", "4.7-stable" ]
    env:
      # Probe BOTH the 4.3 baseline and the newest stable (4.7): the D7_CAPS / D7_WS_RAW
      # markers then answer whether workspace/symbol and the other advertised-but-dead-on-4.3
      # LSP providers actually return results on a modern build. Overrides the workflow-level
      # GODOT_VERSION for this job only; the run steps use it verbatim.
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot + Xvfb
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Boot the editor under Xvfb and run the LSP smoke
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # A CI runner has no GPU, so Godot's default Vulkan backend segfaults on
          # init before the LSP can start. Force software OpenGL (Mesa llvmpipe).
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Bridge auth (default-on) is covered by bridge_auth_smoke.gd; this live
          # probe connects without a secret, so disable auth for the boot.
          BREAKPOINT_BRIDGE_INSECURE: '1'
        run: |
          set -eux
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_BIN" --editor --path "$GODOT_PROJECT" \
            --rendering-driver opengl3 --audio-driver Dummy \
            >/tmp/godot-editor.log 2>&1 &
          GODOT_PID=$!
          # Software-rendered editor boot is slow — wait up to ~120s for the LSP port.
          for i in $(seq 1 60); do
            if node -e "require('net').connect(6005,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "LSP port open"; break
            fi
            sleep 2
          done
          node test-integration/editor-lsp.integration.mjs
          # D3: the Breakpoint MCP addon (:9080) comes up as the editor enables the
          # plugin. Wait for it, then probe the live resource-subscription push path
          # (subscribe -> live selection change -> resources/updated; D3_SUB_* markers).
          for i in $(seq 1 30); do
            if node -e "require('net').connect(9080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "bridge port open"; break
            fi
            sleep 2
          done
          node test-integration/editor-subscriptions.integration.mjs
          kill "$GODOT_PID" 2>/dev/null || true
      - name: Editor log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-editor.log || true

  dap-plane:
    name: DAP / debugger plane vs real adapter (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true   # novel live-adapter probe; must never block a merge
    strategy:
      fail-fast: false        # one Godot version's probe must not cancel the other
      matrix:
        godot: [ "4.3-stable", "4.7-stable" ]
    env:
      # Probe BOTH the 4.3 baseline and the newest stable (4.7): the D_DAP_* markers then
      # show which advertised-but-dead-on-4.3 capabilities (setVariable / evaluate /
      # breakpoint modifiers) actually light up on a modern build. Overrides the
      # workflow-level GODOT_VERSION for this job only; the run steps use it verbatim.
      GODOT_VERSION: ${{ matrix.godot }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot + Xvfb
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Boot the editor under Xvfb and run the DAP smoke
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # Same as the LSP plane: a CI runner has no GPU, so force software OpenGL
          # (Mesa llvmpipe) or Godot's default Vulkan backend segfaults on init.
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Bridge auth (default-on) is covered by bridge_auth_smoke.gd; this live
          # probe connects without a secret, so disable auth for the boot.
          BREAKPOINT_BRIDGE_INSECURE: '1'
        run: |
          set -eux
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_BIN" --editor --path "$GODOT_PROJECT" \
            --rendering-driver opengl3 --audio-driver Dummy \
            >/tmp/godot-editor-dap.log 2>&1 &
          GODOT_PID=$!
          # The Debug Adapter is served by the editor (port 6006). Software-rendered
          # editor boot is slow — wait up to ~120s for the DAP port to open.
          for i in $(seq 1 60); do
            if node -e "require('net').connect(6006,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "DAP port open"; break
            fi
            sleep 2
          done
          node test-integration/editor-dap.integration.mjs
          # Second probe against the same editor: does 4.3 honor condition/hitCondition/
          # logMessage breakpoint modifiers it advertises as unsupported? (log-only)
          sleep 3
          node test-integration/editor-dap-breakpoints.integration.mjs
          kill "$GODOT_PID" 2>/dev/null || true
      - name: Editor log tail (on failure)
        if: always()
        run: tail -n 80 /tmp/godot-editor-dap.log || true

  csharp-plane:
    name: C# / .NET plane vs real Mono build
    runs-on: ubuntu-latest
    # D4 C1 (fixture/boot) + C2 (cs_* semantic tools via OmniSharp) + C3 (cs_dbg_* via netcoredbg).
    # A REQUIRED gate as of session 25: green on real runners across C1+C2+C3 and the C# LSP
    # mutators, so a live-engine regression in the C#/.NET plane now blocks a merge — the way
    # runtime-plane was promoted in session 20. The fixture/host builds, the OmniSharp cs_* LSP
    # probe and the netcoredbg initialize gate (C#_DAP_REACHED) all gate the job; the netcoredbg
    # launch-to-breakpoint flow past that gate stays log-only. See docs/D4_CSHARP_PLAN.md.
    env:
      # The .NET/Mono Godot build (NOT the standard build the other planes download). Its version
      # MUST match the Godot.NET.Sdk pinned in example-csharp/ExampleCsharp.csproj (4.7.0) and the
      # net8.0 target — see docs/D4_CSHARP_PLAN.md §"Version alignment".
      GODOT_VERSION: "4.7-stable"
      # Tool releases are PINNED, not `releases/latest`: csharp-plane is a REQUIRED gate (session 25),
      # so an upstream asset rename — or a bad `latest` — would block every merge. These tags are the
      # known-good releases green on this gate as of the 0.9.0 cut; bump them deliberately after a green
      # run rather than tracking `latest`. The asset names below still resolve via `find`, so a rename
      # at a pinned tag still surfaces as an explicit empty-var failure. See docs/D4_CSHARP_PLAN.md.
      OMNISHARP_VERSION: "v1.39.15"      # OmniSharp/omnisharp-roslyn — published 2025-11-14
      NETCOREDBG_VERSION: "3.2.0-1092"   # Samsung/netcoredbg — published 2026-06-25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          # 8.0.x builds the fixture (net8.0); 6.0.x is the runtime the OmniSharp
          # net6.0 build needs for the C2 cs_* LSP probe below.
          dotnet-version: |
            8.0.x
            6.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Mono/.NET Godot (linux x86_64)
        run: |
          set -eux
          # The mono asset differs from the standard planes: the ZIP expands to a DIRECTORY, and the
          # binary inside carries the "_mono_linux.x86_64" suffix. Resolve it with find so a minor
          # naming change surfaces as an empty-var failure rather than a wrong path.
          curl -fL -o godot-mono.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q godot-mono.zip
          GODOT_BIN="$(find "$PWD/Godot_v${GODOT_VERSION}_mono_linux_x86_64" -maxdepth 1 -type f -name 'Godot_v*_mono_linux.x86_64' | head -1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build the C# project standalone (OmniSharp-readiness, C2)
        working-directory: example-csharp
        run: |
          set -eux
          # Proves the project resolves Godot.NET.Sdk + GodotSharp and compiles WITHOUT the editor —
          # the same build OmniSharp will drive for the cs_* semantic tools in C2.
          dotnet restore
          dotnet build -c Debug --no-restore
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Install OmniSharp (linux x64, net6.0)
        run: |
          set -eux
          # OmniSharp is the C# language server the cs_* tools drive (spawned over stdio by the host).
          # The net6.0 build is a native executable; resolve it with find so a naming change surfaces
          # as an empty-var failure. Version PINNED via $OMNISHARP_VERSION (job env) — a required gate
          # must not ride `releases/latest`, whose asset can be renamed out from under the job.
          curl -fL -o omnisharp.tar.gz "https://github.com/OmniSharp/omnisharp-roslyn/releases/download/${OMNISHARP_VERSION}/omnisharp-linux-x64-net6.0.tar.gz"
          mkdir -p "$PWD/omnisharp" && tar -xzf omnisharp.tar.gz -C "$PWD/omnisharp"
          OMNISHARP_BIN="$(find "$PWD/omnisharp" -maxdepth 2 -type f -name 'OmniSharp' | head -1)"
          test -n "$OMNISHARP_BIN"
          chmod +x "$OMNISHARP_BIN"
          # Do NOT run `OmniSharp --version` as a smoke: some builds start the LSP server and wait on
          # stdin instead of printing a version and exiting, which would hang the step. The probe below
          # (which spawns OmniSharp over stdio and drives an initialize handshake) is the real check.
          echo "resolved OmniSharp: $OMNISHARP_BIN"
          echo "OMNISHARP_BIN=$OMNISHARP_BIN" >> "$GITHUB_ENV"
      - name: Install netcoredbg (linux amd64, C3)
        run: |
          set -eux
          # netcoredbg (Samsung, MIT) is the .NET debug adapter the cs_dbg_* tools drive (spawned over
          # stdio by the host). Resolve the binary with find so a naming change surfaces as an empty-var
          # failure. Version PINNED via $NETCOREDBG_VERSION (job env) — a required gate must not ride
          # `releases/latest`, whose asset can be renamed out from under the job.
          curl -fL -o netcoredbg.tar.gz "https://github.com/Samsung/netcoredbg/releases/download/${NETCOREDBG_VERSION}/netcoredbg-linux-amd64.tar.gz"
          mkdir -p "$PWD/netcoredbg-dist" && tar -xzf netcoredbg.tar.gz -C "$PWD/netcoredbg-dist"
          NETCOREDBG_BIN="$(find "$PWD/netcoredbg-dist" -maxdepth 2 -type f -name 'netcoredbg' | head -1)"
          test -n "$NETCOREDBG_BIN"
          chmod +x "$NETCOREDBG_BIN"
          echo "resolved netcoredbg: $NETCOREDBG_BIN"
          echo "NETCOREDBG_BIN=$NETCOREDBG_BIN" >> "$GITHUB_ENV"
      - name: C2 — live cs_* LSP probe vs real OmniSharp (markers C#_LSP_*)
        working-directory: host
        env:
          GODOT_CSHARP_PROJECT: ${{ github.workspace }}/example-csharp
          GODOT_CSLSP_CMD: ${{ env.OMNISHARP_BIN }}
          GODOT_CSLSP_ARGS: '-lsp'
        run: |
          set -eux
          # OmniSharp drives the design-time build warmed by the standalone step above. The probe
          # reaches the server (the gate) then best-effort exercises the cs_* tools; markers C#_LSP_*.
          # Bounded by an outer timeout so a misbehaving server can never hang the runner.
          timeout 300 node test-integration/csharp-lsp.integration.mjs
      - name: Import + build C# solution (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example-csharp" --import --build-solutions --quit-after 200 || true'
      - name: C3 — live cs_dbg_* DAP probe vs real netcoredbg (markers C#_DAP_*)
        working-directory: host
        env:
          GODOT_CSHARP_PROJECT: ${{ github.workspace }}/example-csharp
          GODOT_CSDAP_CMD: ${{ env.NETCOREDBG_BIN }}
          GODOT_CSHARP_BIN: ${{ env.GODOT_BIN }}
        run: |
          set -eux
          # The C# solution was just built, so the game can run under the debugger. The probe reaches
          # netcoredbg (the gate: C#_DAP_REACHED) then best-effort launches the game to a breakpoint;
          # markers C#_DAP_*. Bounded by an outer timeout so a misbehaving adapter can never hang the
          # runner. LOG-ONLY beyond the gate — the netcoredbg + Godot native-host attach story is the
          # least-certain piece of D4 (see docs/D4_CSHARP_PLAN.md), proven by the mock unit suite.
          timeout 180 node test-integration/csharp-dap.integration.mjs
      - name: Boot the C# game headless (C1 smoke — the .NET assembly loads and the scene runs)
        run: |
          set -eux
          # C1 acceptance: the engine boots C#. Player._Ready() prints the marker on the first frame;
          # --quit-after keeps it deterministic and the outer timeout guards against a hang.
          timeout 120 "$GODOT_BIN" --headless --path "${{ github.workspace }}/example-csharp" \
            --quit-after 200 >/tmp/godot-csharp.log 2>&1 || true
          echo "=== C#_PLANE log ==="; cat /tmp/godot-csharp.log || true
          if grep -q "\[example-csharp\] player ready" /tmp/godot-csharp.log; then
            echo "C#_PLANE_BOOT_OK: C# _Ready ran under the Mono build"
          else
            echo "C#_PLANE_BOOT_FAIL: '[example-csharp] player ready' marker not found"
            exit 1
          fi
      - name: C# game log tail (on failure)
        if: always()
        run: tail -n 80 /tmp/godot-csharp.log || true

  authoring-plane:
    name: authoring plane / A-G mutators vs real editor
    runs-on: ubuntu-latest
    # A REQUIRED gate as of session 42: the A-G authoring probe (191/191 forward + undo/redo assertions,
    # covering Group A nodes/scenes/signals, B resources/filesystem, C animation, D tileset/tilemap,
    # E physics/collision, F VFX/audio and G UI/controls/theming) is green across #47, two main pushes, #48 and #49 — so a
    # live-engine regression in the authoring plane now blocks a merge, the way runtime-plane was
    # promoted in session 20 and csharp-plane in session 25. Added to branch protection as the context
    # "authoring plane / A-G mutators vs real editor".
    env:
      # The Groups A-G authoring mutators are version-stable engine features, so a single newest-stable
      # arm is enough — unlike the LSP/DAP planes, which matrix 4.3/4.7 to reveal capability divergence.
      # Overrides the workflow-level GODOT_VERSION for this job only.
      GODOT_VERSION: "4.7-stable"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot + Xvfb
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Boot the editor under Xvfb and run the authoring (A-G) mutator probe
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # A CI runner has no GPU, so Godot's default Vulkan backend segfaults on init before the
          # addon bridge can start. Force software OpenGL (Mesa llvmpipe), same as the editor/dap planes.
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Bridge auth (default-on) is covered by bridge_auth_smoke.gd; this live
          # probe connects without a secret, so disable auth for the boot.
          BREAKPOINT_BRIDGE_INSECURE: '1'
        run: |
          set -eux
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_BIN" --editor --path "$GODOT_PROJECT" \
            --rendering-driver opengl3 --audio-driver Dummy \
            >/tmp/godot-editor-authoring.log 2>&1 &
          GODOT_PID=$!
          # The Breakpoint MCP addon opens :9080 once the editor enables the plugin. Software-rendered
          # editor boot is slow — wait up to ~120s for the bridge port before driving the mutators.
          for i in $(seq 1 60); do
            if node -e "require('net').connect(9080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "bridge port open"; break
            fi
            sleep 2
          done
          # Baseline for the independent oracle in the next step. Taken HERE, after the
          # editor has booted and before the probe runs, because booting the editor is
          # itself a write: Godot rewrites project.godot (resolving the autoload to a
          # uid://, and dropping the comment block while it is at it) and mints .uid
          # siblings for any script that lacks one. Measured on a real boot, session 148.
          # Comparing against HEAD would therefore blame the probe for the editor's dirt.
          git -C "${{ github.workspace }}" status --porcelain example/ | sort > /tmp/example-before.txt
          node test-integration/authoring-plane.integration.mjs
          kill "$GODOT_PID" 2>/dev/null || true
      # A SECOND, INDEPENDENT ORACLE for the same property AUTH_CLEAN asserts.
      #
      # AUTH_CLEAN compares the tree against the probe's OWN snapshot. That is the check
      # that can name a leftover precisely, but it is also the probe grading its own
      # homework: if the snapshot were taken at the wrong moment, or the walk skipped a
      # directory it should not have, the restore and the assertion would be wrong in
      # exactly the same direction and the job would still be green. git does not share
      # that failure mode — it knows nothing about SKIP_DIRS or when the snapshot ran.
      #
      # The two have overlapping but not identical blind spots, which is the point: git
      # ignores *.import and .godot/ (so it will not flag engine churn), while the snapshot
      # ignores tracked-ness (so it catches an untracked leftover AND a modified tracked
      # file). Neither subsumes the other, and both must come back clean.
      #
      # This compares BEFORE-probe against AFTER-probe, not against HEAD. example/ is
      # legitimately dirty before the probe ever runs — see the baseline capture above —
      # so an absolute check would fail the job for the editor's writes. The delta is the
      # probe's contribution and nothing else, which is exactly the claim being tested.
      - name: The probe must have left the tree exactly as it found it
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          git status --porcelain example/ | sort > /tmp/example-after.txt
          diff /tmp/example-before.txt /tmp/example-after.txt > /tmp/example-delta.txt || true

          # --- why example/project.godot is tolerated HERE and asserted BELOW ---
          # The baseline above is taken when the bridge port opens. The editor's own
          # rewrite of project.godot (autoload res:// -> uid://) is NOT synchronised
          # with that port, and the probe's own snapshot happens ~12s later still, so
          # the rewrite can land on either side of the baseline. All three orderings
          # have been observed on real runs:
          #   rewrite before the baseline  -> dirty in both, no delta          (PASS)
          #   rewrite after AUTH_CLEAN's snapshot -> probe restores it, restored=1 (PASS)
          #   rewrite BETWEEN the two      -> clean baseline, dirty after      (FAILED)
          # The third is a false alarm: the probe did nothing wrong, and session 149
          # hit it on an unrelated PR. Requiring an empty delta therefore made this
          # oracle a coin flip on a ~12s window.
          #
          # Tolerating the file alone would be the weak fix -- and note the old form
          # was ALREADY blind here: when the rewrite landed before the baseline, the
          # file was dirty on both sides and nothing ever looked inside it. So the
          # content assertion below is not a concession, it is strictly more than the
          # empty-delta form ever checked.
          # NB the two spaces: `diff` prefixes with "> ", and porcelain's own X column
          # is blank for an unstaged modification, so the line reads ">  M example/...".
          # A single-space pattern silently matches nothing and fails every run.
          unexpected=$(grep -E '^[<>]' /tmp/example-delta.txt | grep -vE '^[<>][[:space:]]+M[[:space:]]example/project\.godot$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the authoring probe changed example/ and did not put it back — git sees a delta AUTH_CLEAN's snapshot did not"
            echo "--- before the probe (editor already booted) vs after ---"
            cat /tmp/example-delta.txt
            exit 1
          fi

          # If project.godot is dirty at all -- from either side of the baseline -- the
          # ONLY change permitted in it is the autoload line the editor rewrites to the
          # uid:// form. That is the trade #145 accepted deliberately, and check 17
          # gates the COMMITTED form; this gates what a live boot is allowed to do to it.
          # Anything else means something wrote a project setting and left it behind.
          if ! git diff --quiet -- example/project.godot; then
            if git diff -U0 -- example/project.godot \
                 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                 | grep -qvE '^[+-]BreakpointRuntimeBridge='; then
              echo "::error::example/project.godot changed beyond the editor's accepted autoload rewrite"
              git diff -- example/project.godot
              exit 1
            fi
            echo "example/project.godot carries only the editor's accepted autoload rewrite (#145)"
          fi
          echo "example/ is exactly as the probe found it — git agrees with AUTH_CLEAN"
      - name: Editor log tail (on failure)
        if: always()
        run: tail -n 80 /tmp/godot-editor-authoring.log || true

  render-plane:
    name: render path / screenshot capture vs a real rasterizer (Xvfb + llvmpipe)
    runs-on: ubuntu-latest
    # The GDScript unit suite AGAIN, but with a rasterizer that actually draws.
    # gdscript-unit runs it under --headless, where the capture path cannot execute
    # and is correctly reported as a SKIP. This job is the one that makes it a PASS.
    # No GPU is involved or required: Mesa llvmpipe is software, but it is a real
    # rasterizer, and it is enough to exercise get_image() end to end.
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot + Xvfb
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Run the addon unit suite against a live rasterizer
        env:
          # A CI runner has no GPU, so force software OpenGL (Mesa llvmpipe) — the
          # same override the editor-plane job uses. Software, but NOT the dummy
          # driver: it draws, so the capture path is genuinely exercised.
          LIBGL_ALWAYS_SOFTWARE: '1'
          # The whole reason this job exists: here, a degraded capture is a FAILURE.
          # gdscript-unit is allowed to skip it; this job is not.
          BREAKPOINT_TEST_REQUIRE_RENDER: '1'
        run: |
          set -eu
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_BIN" --path "${{ github.workspace }}/example" \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/ops_unit_test.gd > /tmp/ops-render.log 2>&1 || true
          echo "=== ops_unit_test.gd (live rasterizer) ==="
          cat /tmp/ops-render.log
          echo "=========================================="
          if ! grep -q "OPS_UNIT_SUMMARY" /tmp/ops-render.log; then
            echo "::error::no OPS_UNIT_SUMMARY — the script did not complete"; exit 1
          fi
          if grep -q "OPS_UNIT_FAIL" /tmp/ops-render.log; then
            echo "::error::an assertion failed against a live rasterizer"; exit 1
          fi
          # This job's REASON FOR EXISTING. Green without these two lines would be a
          # job that proves nothing while looking like coverage — the exact defect
          # this whole change set is here to remove. Assert its own premise.
          if ! grep -q "OPS_UNIT_PASS rb.shot.mime" /tmp/ops-render.log; then
            echo "::error::capture path did not execute — this job proved nothing"; exit 1
          fi
          if grep -q "OPS_UNIT_SKIP rb.shot.capture" /tmp/ops-render.log; then
            echo "::error::capture was SKIPPED in the job whose only purpose is to run it"; exit 1
          fi
          echo "render path verified: $(grep -o 'OPS_UNIT_RENDER.*' /tmp/ops-render.log)"
          echo "$(grep -o 'OPS_UNIT_SUMMARY.*' /tmp/ops-render.log)"

  runtime-render-plane:
    name: runtime plane vs a real rasterizer (Xvfb + llvmpipe)
    runs-on: ubuntu-latest
    # render-plane covers the EDITOR-side capture, but it does so with a --script
    # run, and runtime_screenshot_diff needs a RUNNING GAME. So this is the other
    # half of the same correction: same Xvfb + llvmpipe rasterizer, applied to
    # Plane C instead of the addon unit suite.
    #
    # The handoffs called this "the one thing CI structurally cannot do". It was
    # the same mistake RENDER_PATH_COVERAGE_GAP §2 made and #138 disproved:
    # llvmpipe is software but it is a REAL rasterizer that draws, and what
    # actually blocked the capture was the dummy driver that --headless selects.
    # Drop --headless, keep LIBGL_ALWAYS_SOFTWARE=1, and get_image() works.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: host/package-lock.json
      - name: Install Godot + Xvfb
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
          curl -fL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Build host
        working-directory: host
        run: npm ci && npm run build
      - name: Import the example project (headless)
        run: '"$GODOT_BIN" --headless --path "${{ github.workspace }}/example" --import || true'
      - name: Boot the render probe scene under a live rasterizer and diff real pixels
        working-directory: host
        env:
          GODOT_PROJECT: ${{ github.workspace }}/example
          # The default-on loopback handshake is covered by bridge_auth_smoke.gd;
          # this probe connects without a secret, so disable auth for the boot.
          BREAKPOINT_BRIDGE_INSECURE: '1'
          # A distinct port so this game can never be confused with runtime-plane's
          # :9081 / :9082 if the jobs ever share a runner.
          BREAKPOINT_RUNTIME_PORT: '9083'
          # Software OpenGL (Mesa llvmpipe) — no GPU on a runner, but NOT the dummy
          # driver: it draws, so the capture path is genuinely exercised.
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -eux
          # pipefail matters below: the probe is piped through `tee`, and without
          # it the step's exit status would be tee's (always 0) — a failed
          # assertion would print and be ignored.
          set -o pipefail
          # NOTE THE ABSENCE OF --headless. That is the entire point of this job:
          # under --headless the viewport has no texture and runtime_screenshot
          # degrades to no_image, which the probe treats as a hard failure.
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_BIN" --path "$GODOT_PROJECT" res://tests/render_probe.tscn \
            --rendering-driver opengl3 --audio-driver Dummy >/tmp/godot-render.log 2>&1 &
          for i in $(seq 1 60); do
            if node -e "require('net').connect(9083,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "render probe port open"; break
            fi
            sleep 1
          done
          node test-integration/runtime-screenshot.integration.mjs | tee /tmp/render-live.log
          # The probe already exits non-zero on any failed assertion, and pipefail
          # now propagates that. This second pass is belt-and-braces on the job's
          # REASON FOR EXISTING: a run that somehow reported success without these
          # markers would be a job that proves nothing while looking like coverage,
          # which is the exact defect #138/#139 removed elsewhere.
          for marker in RENDER_LIVE_CAPTURE RENDER_LIVE_SELF RENDER_LIVE_CHANGE RENDER_LIVE_REGION_IN RENDER_LIVE_REGION_OUT RENDER_LIVE_RESULT; do
            if ! grep -q "$marker" /tmp/render-live.log; then
              echo "::error::$marker missing — the pixel path did not execute"; exit 1
            fi
          done
          echo "live render verified: $(grep -o 'RENDER_LIVE_RESULT.*' /tmp/render-live.log)"
      - name: Game log tail (on failure)
        if: always()
        run: tail -n 50 /tmp/godot-render.log || true
